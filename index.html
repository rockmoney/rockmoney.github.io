<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Rocky's Base Project</title>

  <meta name="base:app_id" content="698d6ec5b3590846b38398f8">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #050505;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .container {
      max-width: 600px;
      margin: auto;
      padding: 35px 20px;
    }

    h1 {
      color: #3b82f6;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #aaa;
      margin-bottom: 30px;
    }

    .wallet {
      background: #111;
      border: 1px solid #333;
      border-radius: 15px;
      padding: 20px;
      margin-bottom: 25px;
    }

    button {
      width: 100%;
      padding: 15px;
      margin: 8px 0;
      border: 0;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
    }

    button:disabled {
      opacity: 0.5;
    }

    #status {
      word-break: break-all;
      color: #aaa;
      margin: 12px 0;
      font-size: 14px;
    }

    #message {
      min-height: 24px;
      margin-top: 15px;
      color: #60a5fa;
      word-break: break-word;
    }

    #game {
      margin-top: 25px;
      border: 2px solid #2563eb;
      border-radius: 10px;
      width: 100%;
      max-width: 500px;
      height: 300px;
      background: black;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Rocky's Base Project</h1>

  <div class="subtitle">
    Base + MetaMask + Builder Code
  </div>

  <div class="wallet">

    <div id="status">
      Wallet not connected
    </div>

    <button id="connectBtn">
      Connect MetaMask
    </button>

    <button id="switchBtn" disabled>
      Switch to Base
    </button>

    <button id="testBtn" disabled>
      Test Builder Code
    </button>

    <div id="message"></div>

  </div>

  <canvas id="game" width="500" height="300"></canvas>

</div>


<script type="module">

/*
========================================================
 METAMASK CONNECT
========================================================
*/

import { createEVMClient }
  from "https://esm.sh/@metamask/connect-evm";


/*
========================================================
 SETTINGS
========================================================
*/

// Base Mainnet
const BASE_CHAIN_ID = "0x2105";

// Your Builder Code
const BUILDER_CODE = "bc_q8bj3kjd";


/*
========================================================
 ERC-8021 BUILDER CODE
========================================================

 schemaData:
   Builder Code bytes
   + number of codes

 schema:
   schema ID 0

 marker:
   ERC-8021 marker
========================================================
*/

const BUILDER_SUFFIX =
  "0x" +
  "62635f7138626a336b6a64" +
  "01" +
  "00" +
  "80218021802180218021802180218021";


/*
========================================================
 ELEMENTS
========================================================
*/

const connectBtn =
  document.getElementById("connectBtn");

const switchBtn =
  document.getElementById("switchBtn");

const testBtn =
  document.getElementById("testBtn");

const status =
  document.getElementById("status");

const message =
  document.getElementById("message");


/*
========================================================
 VARIABLES
========================================================
*/

let evmClient = null;
let provider = null;
let account = null;
let currentChain = null;


/*
========================================================
 INITIALIZE METAMASK CONNECT
========================================================
*/

async function initializeWallet() {

  try {

    message.textContent =
      "Loading MetaMask...";

    evmClient = await createEVMClient({

      dapp: {

        name: "Rocky's Base Project",

        url: window.location.href

      },

      api: {

        supportedNetworks: {

          "0x2105":
            "https://mainnet.base.org"

        }

      }

    });

    provider =
      evmClient.getProvider();


    /*
    Listen for account changes
    */

    provider.on(
      "accountsChanged",
      accountsChanged
    );


    /*
    Listen for chain changes
    */

    provider.on(
      "chainChanged",
      chainChanged
    );


    message.textContent =
      "Ready.";

  } catch (error) {

    console.error(error);

    message.textContent =
      "MetaMask initialization failed: " +
      getErrorMessage(error);

  }

}


/*
========================================================
 CONNECT
========================================================
*/

async function connectWallet() {

  try {

    connectBtn.disabled = true;

    message.textContent =
      "Opening MetaMask...";


    /*
    MetaMask Connect handles mobile
    deeplinking automatically.
    */

    const result =
      await evmClient.connect({

        chainIds: [
          BASE_CHAIN_ID
        ],

        forceRequest: true

      });


    account =
      result.accounts[0];

    currentChain =
      result.chainId;


    /*
    If MetaMask connected to another
    chain, switch to Base.
    */

    if (currentChain !== BASE_CHAIN_ID) {

      await switchToBase();

    }


    updateWalletDisplay();

    message.textContent =
      "Connected to Base.";

  } catch (error) {

    console.error(error);

    message.textContent =
      "Connection error: " +
      getErrorMessage(error);

  } finally {

    connectBtn.disabled = false;

  }

}


/*
========================================================
 SWITCH TO BASE
========================================================
*/

async function switchToBase() {

  try {

    message.textContent =
      "Switching MetaMask to Base...";


    await evmClient.switchChain({

      chainId: BASE_CHAIN_ID,

      chainConfiguration: {

        chainName: "Base",

        nativeCurrency: {

          name: "Ether",

          symbol: "ETH",

          decimals: 18

        },

        rpcUrls: [
          "https://mainnet.base.org"
        ],

        blockExplorerUrls: [
          "https://basescan.org"
        ]

      }

    });


    currentChain =
      BASE_CHAIN_ID;


    updateWalletDisplay();


  } catch (error) {

    console.error(error);

    message.textContent =
      "Could not switch to Base: " +
      getErrorMessage(error);

  }

}


/*
========================================================
 ACCOUNT CHANGED
========================================================
*/

function accountsChanged(accounts) {

  if (
    !accounts ||
    accounts.length === 0
  ) {

    account = null;

    status.textContent =
      "Wallet not connected";

    testBtn.disabled = true;
    switchBtn.disabled = true;

    return;

  }


  account =
    accounts[0];

  updateWalletDisplay();

}


/*
========================================================
 CHAIN CHANGED
========================================================
*/

function chainChanged(chainId) {

  currentChain =
    chainId;

  updateWalletDisplay();

}


/*
========================================================
 UPDATE DISPLAY
========================================================
*/

function updateWalletDisplay() {

  if (!account) {

    status.textContent =
      "Wallet not connected";

    testBtn.disabled = true;
    switchBtn.disabled = true;

    return;

  }


  if (
    currentChain === BASE_CHAIN_ID
  ) {

    status.innerHTML =
      "<strong>Connected to Base</strong><br><br>" +
      account;

    connectBtn.textContent =
      "MetaMask Connected";

    testBtn.disabled = false;
    switchBtn.disabled = true;

  } else {

    status.innerHTML =
      "<strong>Wallet connected</strong><br><br>" +
      account +
      "<br><br>" +
      "Wrong network";

    testBtn.disabled = true;
    switchBtn.disabled = false;

  }

}


/*
========================================================
 TEST BUILDER CODE
========================================================
*/

async function testBuilderCode() {

  if (!provider || !account) {

    message.textContent =
      "Connect MetaMask first.";

    return;

  }


  if (currentChain !== BASE_CHAIN_ID) {

    message.textContent =
      "Switch to Base first.";

    return;

  }


  try {

    testBtn.disabled = true;

    message.textContent =
      "Opening MetaMask...";


    /*
    Base Multicall3 contract.

    This is a smart contract, NOT a wallet address.
    Therefore calldata is permitted.
    */

    const MULTICALL3 =
      "0xcA11bde05977b3631167028862bE2a173976CA11";


    /*
    Multicall3 getCurrentBlockTimestamp()
    */

    const CALL_DATA =
      "0x0b3f5e9e";


    /*
    EIP-5792 wallet_sendCalls
    with ERC-8021 dataSuffix.
    */

    const response =
      await provider.request({

        method: "wallet_sendCalls",

        params: [{

          version: "1",

          from: account,

          chainId: BASE_CHAIN_ID,

          atomicRequired: false,

          calls: [{

            to: MULTICALL3,

            value: "0x0",

            data: CALL_DATA

          }],

          capabilities: {

            dataSuffix: {

              value:
                BUILDER_SUFFIX,

              optional: true

            }

          }

        }]

      });


    console.log(
      "Builder Code:",
      BUILDER_CODE
    );

    console.log(
      "Builder suffix:",
      BUILDER_SUFFIX
    );

    console.log(
      "MetaMask response:",
      response
    );


    message.innerHTML =
      "Builder Code transaction submitted.<br><br>" +
      "Code: " +
      BUILDER_CODE;


  } catch (error) {

    console.error(error);

    message.textContent =
      "Transaction error: " +
      getErrorMessage(error);

  } finally {

    testBtn.disabled = false;

  }

}


/*
========================================================
 ERROR HANDLER
========================================================
*/

function getErrorMessage(error) {

  if (!error) {
    return "Unknown error";
  }

  if (error.message) {
    return error.message;
  }

  if (error.rpcMessage) {
    return error.rpcMessage;
  }

  return String(error);

}


/*
========================================================
 BUTTONS
========================================================
*/

connectBtn.addEventListener(
  "click",
  connectWallet
);

switchBtn.addEventListener(
  "click",
  switchToBase
);

testBtn.addEventListener(
  "click",
  testBuilderCode
);


/*
========================================================
 START WALLET
========================================================
*/

initializeWallet();


/*
========================================================
 PONG GAME
========================================================
*/

const canvas =
  document.getElementById("game");

const ctx =
  canvas.getContext("2d");

let ballX = 250;
let ballY = 150;

let ballDX = 3;
let ballDY = 3;

let paddleY = 125;


function gameLoop() {

  ctx.fillStyle = "black";

  ctx.fillRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  ctx.fillStyle = "#2563eb";

  ctx.fillRect(
    10,
    paddleY,
    10,
    50
  );


  ctx.beginPath();

  ctx.arc(
    ballX,
    ballY,
    7,
    0,
    Math.PI * 2
  );

  ctx.fill();


  ballX += ballDX;
  ballY += ballDY;


  if (
    ballY <= 7 ||
    ballY >= canvas.height - 7
  ) {

    ballDY *= -1;

  }


  if (
    ballX <= 20 &&
    ballY >= paddleY &&
    ballY <= paddleY + 50
  ) {

    ballDX *= -1;

  }


  if (
    ballX >= canvas.width - 7
  ) {

    ballX = 250;
    ballY = 150;

  }


  requestAnimationFrame(
    gameLoop
  );

}


/*
========================================================
 PADDLE CONTROL
========================================================
*/

document.addEventListener(
  "mousemove",
  event => {

    const rect =
      canvas.getBoundingClientRect();

    paddleY =
      event.clientY -
      rect.top -
      25;

    paddleY =
      Math.max(
        0,
        Math.min(
          canvas.height - 50,
          paddleY
        )
      );

  }
);


/*
========================================================
 START GAME
========================================================
*/

gameLoop();

</script>

</body>
</html>
