<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Base ERC-8021 Attribution Test</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 720px;
      margin: 0 auto;
      padding: 24px;
      background: #111;
      color: #fff;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 8px;
    }

    .sub {
      color: #aaa;
      margin-bottom: 24px;
    }

    label {
      display: block;
      margin-top: 18px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #444;
      background: #1c1c1c;
      color: white;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 18px;
      border: 0;
      border-radius: 8px;
      background: #fff;
      color: #000;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .box {
      margin-top: 20px;
      padding: 14px;
      border-radius: 8px;
      background: #1b1b1b;
      border: 1px solid #333;
      word-break: break-all;
    }

    .good {
      color: #55e68a;
    }

    .bad {
      color: #ff6b6b;
    }

    .small {
      font-size: 13px;
      color: #aaa;
      line-height: 1.5;
    }

    code {
      word-break: break-all;
      color: #ddd;
    }

    a {
      color: #6ea8ff;
    }
  </style>
</head>

<body>

  <h1>Base ERC-8021 Attribution Test</h1>

  <div class="sub">
    Sends a 0 ETH self-transaction on Base Mainnet with an ERC-8021 attribution suffix.
  </div>

  <button id="connectButton">
    Connect MetaMask
  </button>

  <div id="walletBox" class="box">
    Wallet: Not connected
  </div>

  <label for="builderCode">
    Base Builder Code
  </label>

  <input
    id="builderCode"
    type="text"
    value="baseapp"
    maxlength="32"
    placeholder="Enter your Builder Code"
  >

  <div class="small">
    Replace "baseapp" with your actual Builder Code from Base.
  </div>

  <button id="prepareButton" disabled>
    Prepare ERC-8021 Transaction
  </button>

  <div id="details" class="box" style="display:none;"></div>

  <button id="sendButton" disabled>
    Send ERC-8021 Transaction
  </button>

  <div id="status" class="box">
    Status: Waiting for wallet connection.
  </div>

<script>
"use strict";

/*
  ============================================================
  BASE ERC-8021 TEST
  ============================================================

  Base Mainnet:
    Chain ID: 8453
    Hex:      0x2105

  ERC-8021 Schema 0:

    [codes]
    [codesLength: 1 byte]
    [schemaId: 1 byte]
    [ERC-8021 marker: 16 bytes]

  Marker:

    80218021802180218021802180218021

  Example "baseapp":

    ASCII:
      baseapp

    Hex:
      62617365617070

    Length:
      07

    Schema:
      00

    Final suffix:

      62617365617070070080218021802180218021802180218021
*/


const BASE_CHAIN_ID = "0x2105";
const BASE_CHAIN_ID_DECIMAL = 8453;

const ERC8021_MARKER =
  "80218021802180218021802180218021";

let provider = null;
let walletAddress = null;
let preparedData = null;


/*
  ------------------------------------------------------------
  DOM
  ------------------------------------------------------------
*/

const connectButton =
  document.getElementById("connectButton");

const prepareButton =
  document.getElementById("prepareButton");

const sendButton =
  document.getElementById("sendButton");

const builderCodeInput =
  document.getElementById("builderCode");

const walletBox =
  document.getElementById("walletBox");

const details =
  document.getElementById("details");

const statusBox =
  document.getElementById("status");


/*
  ------------------------------------------------------------
  Helpers
  ------------------------------------------------------------
*/

function setStatus(message, good = false, bad = false) {
  statusBox.className = "box";

  if (good) {
    statusBox.classList.add("good");
  }

  if (bad) {
    statusBox.classList.add("bad");
  }

  statusBox.innerHTML = message;
}


function strip0x(value) {
  return value.startsWith("0x")
    ? value.slice(2)
    : value;
}


function asciiToHex(text) {
  let result = "";

  for (let i = 0; i < text.length; i++) {
    const code = text.charCodeAt(i);

    if (code > 0x7f) {
      throw new Error(
        "Builder Code must contain ASCII characters only."
      );
    }

    result += code.toString(16).padStart(2, "0");
  }

  return result;
}


function validateBuilderCode(code) {

  if (!code) {
    throw new Error("Builder Code cannot be empty.");
  }

  if (code.length > 255) {
    throw new Error(
      "Builder Code is too long for Schema 0."
    );
  }

  /*
    ERC-8021 codes are ASCII strings.

    Reject:
      comma
      control characters
      non-ASCII characters
  */

  for (let i = 0; i < code.length; i++) {

    const c = code.charCodeAt(i);

    if (c < 0x20 || c > 0x7e) {
      throw new Error(
        "Builder Code contains an invalid character."
      );
    }

    if (code[i] === ",") {
      throw new Error(
        "A single Builder Code cannot contain a comma."
      );
    }
  }
}


function buildERC8021Suffix(builderCode) {

  validateBuilderCode(builderCode);

  const codeHex =
    asciiToHex(builderCode);

  const codeLength =
    (builderCode.length)
      .toString(16)
      .padStart(2, "0");

  /*
    Schema 0 = 00
  */

  const schemaId = "00";

  const suffix =
    codeHex +
    codeLength +
    schemaId +
    ERC8021_MARKER;

  return "0x" + suffix;
}


function verifyERC8021(data) {

  const clean =
    strip0x(data).toLowerCase();

  const marker =
    clean.slice(-32);

  return marker ===
    ERC8021_MARKER.toLowerCase();
}


function getSuffix(data) {

  const clean =
    strip0x(data);

  return clean.slice(-32);
}


function shortAddress(address) {

  if (!address) {
    return "";
  }

  return (
    address.slice(0, 6) +
    "..." +
    address.slice(-4)
  );
}


/*
  ------------------------------------------------------------
  Connect MetaMask
  ------------------------------------------------------------
*/

connectButton.addEventListener(
  "click",
  async () => {

    try {

      if (!window.ethereum) {
        throw new Error(
          "MetaMask was not detected. Open this page in a browser with MetaMask."
        );
      }

      provider = window.ethereum;

      setStatus(
        "Requesting MetaMask connection..."
      );

      const accounts =
        await provider.request({
          method: "eth_requestAccounts"
        });

      if (!accounts || accounts.length === 0) {
        throw new Error(
          "No wallet account was returned."
        );
      }

      walletAddress = accounts[0];

      /*
        Force Base Mainnet.
      */

      try {

        await provider.request({
          method: "wallet_switchEthereumChain",
          params: [
            {
              chainId: BASE_CHAIN_ID
            }
          ]
        });

      } catch (switchError) {

        /*
          Base Mainnet may not yet exist in a wallet.
          Add it if necessary.
        */

        if (
          switchError.code === 4902 ||
          switchError.code === -32603
        ) {

          await provider.request({
            method: "wallet_addEthereumChain",
            params: [
              {
                chainId: BASE_CHAIN_ID,
                chainName: "Base",
                nativeCurrency: {
                  name: "Ether",
                  symbol: "ETH",
                  decimals: 18
                },
                rpcUrls: [
                  "https://mainnet.base.org"
                ],
                blockExplorerUrls: [
                  "https://basescan.org"
                ]
              }
            ]
          });

        } else {
          throw switchError;
        }
      }

      const currentChain =
        await provider.request({
          method: "eth_chainId"
        });

      if (
        currentChain.toLowerCase() !==
        BASE_CHAIN_ID.toLowerCase()
      ) {
        throw new Error(
          "MetaMask is not on Base Mainnet."
        );
      }

      walletBox.innerHTML =
        "<strong>Wallet:</strong> " +
        shortAddress(walletAddress) +
        "<br><br>" +
        "<strong>Network:</strong> Base Mainnet (8453)";

      prepareButton.disabled = false;

      connectButton.textContent =
        "Wallet Connected";

      setStatus(
        "Connected to Base Mainnet.",
        true
      );

    } catch (error) {

      console.error(error);

      setStatus(
        "Connection error:<br>" +
        escapeHtml(error.message || String(error)),
        false,
        true
      );
    }
  }
);


/*
  ------------------------------------------------------------
  Prepare transaction
  ------------------------------------------------------------
*/

prepareButton.addEventListener(
  "click",
  async () => {

    try {

      if (!walletAddress) {
        throw new Error(
          "Connect MetaMask first."
        );
      }

      const builderCode =
        builderCodeInput.value.trim();

      /*
        Build ERC-8021 suffix.
      */

      const suffix =
        buildERC8021Suffix(builderCode);

      /*
        This is intentionally an empty transaction
        payload BEFORE the ERC-8021 suffix.

        The transaction will therefore contain:

        0x
        + builder code
        + length
        + schema ID
        + ERC-8021 marker
      */

      const transactionData =
        suffix;

      /*
        Verify the marker is actually the final 16 bytes.
      */

      if (!verifyERC8021(transactionData)) {
        throw new Error(
          "ERC-8021 verification failed."
        );
      }

      preparedData = transactionData;

      const suffixHex =
        getSuffix(transactionData);

      const expected =
        ERC8021_MARKER;

      details.style.display = "block";

      details.innerHTML = `
        <strong>Builder Code:</strong><br>
        <code>${escapeHtml(builderCode)}</code>

        <br><br>

        <strong>Schema:</strong><br>
        <code>0x00</code>

        <br><br>

        <strong>ERC-8021 Marker:</strong><br>
        <code>${expected}</code>

        <br><br>

        <strong>Final 16 Bytes:</strong><br>
        <code>${suffixHex}</code>

        <br><br>

        <strong>Marker Check:</strong>
        <span class="good">VALID</span>

        <br><br>

        <strong>Complete Transaction Data:</strong><br>
        <code>${transactionData}</code>
      `;

      sendButton.disabled = false;

      setStatus(
        "ERC-8021 calldata prepared successfully. The final 16 bytes are the required 8021 marker.",
        true
      );

    } catch (error) {

      console.error(error);

      setStatus(
        "Preparation error:<br>" +
        escapeHtml(error.message || String(error)),
        false,
        true
      );

      sendButton.disabled = true;
    }
  }
);


/*
  ------------------------------------------------------------
  Send transaction
  ------------------------------------------------------------
*/

sendButton.addEventListener(
  "click",
  async () => {

    try {

      if (!preparedData) {
        throw new Error(
          "Prepare the transaction first."
        );
      }

      /*
        Re-check Base before sending.
      */

      const chainId =
        await provider.request({
          method: "eth_chainId"
        });

      if (
        chainId.toLowerCase() !==
        BASE_CHAIN_ID.toLowerCase()
      ) {
        throw new Error(
          "MetaMask changed networks. Please return to Base Mainnet."
        );
      }

      /*
        Verify one more time immediately before signing.
      */

      if (!verifyERC8021(preparedData)) {
        throw new Error(
          "Transaction data failed the ERC-8021 marker check."
        );
      }

      /*
        0 ETH self-transaction.

        This is intentionally used only as an attribution test.

        The wallet pays normal Base transaction gas,
        but no ETH is transferred to another address.
      */

      const tx = {
        from: walletAddress,
        to: walletAddress,
        value: "0x0",
        data: preparedData
      };

      setStatus(
        "Opening MetaMask. Review the transaction and confirm it only if you want to send the test transaction..."
      );

      const txHash =
        await provider.request({
          method: "eth_sendTransaction",
          params: [tx]
        });

      details.innerHTML += `
        <br><br>

        <strong>Transaction Hash:</strong><br>
        <code>${escapeHtml(txHash)}</code>

        <br><br>

        <a
          href="https://basescan.org/tx/${encodeURIComponent(txHash)}"
          target="_blank"
          rel="noopener noreferrer"
        >
          Open transaction on BaseScan
        </a>
      `;

      setStatus(
        "Transaction submitted successfully.<br><br>" +
        "The ERC-8021 marker was present in the calldata before MetaMask signed it.",
        true
      );

      sendButton.disabled = true;

    } catch (error) {

      console.error(error);

      setStatus(
        "Transaction error:<br>" +
        escapeHtml(error.message || String(error)),
        false,
        true
      );
    }
  }
);


/*
  ------------------------------------------------------------
  MetaMask account/network changes
  ------------------------------------------------------------
*/

function setupMetaMaskListeners() {

  if (!window.ethereum) {
    return;
  }

  window.ethereum.on(
    "accountsChanged",
    (accounts) => {

      if (!accounts || accounts.length === 0) {

        walletAddress = null;

        prepareButton.disabled = true;
        sendButton.disabled = true;

        walletBox.innerHTML =
          "Wallet: Disconnected";

        setStatus(
          "Wallet disconnected."
        );

        return;
      }

      walletAddress = accounts[0];

      walletBox.innerHTML =
        "<strong>Wallet:</strong> " +
        shortAddress(walletAddress);

      preparedData = null;
      sendButton.disabled = true;
    }
  );


  window.ethereum.on(
    "chainChanged",
    (chainId) => {

      if (
        chainId.toLowerCase() !==
        BASE_CHAIN_ID.toLowerCase()
      ) {

        sendButton.disabled = true;

        setStatus(
          "Wrong network. Switch MetaMask back to Base Mainnet.",
          false,
          true
        );

      } else {

        setStatus(
          "Base Mainnet connected.",
          true
        );

        if (walletAddress) {
          prepareButton.disabled = false;
        }
      }
    }
  );
}


setupMetaMaskListeners();


/*
  ------------------------------------------------------------
  HTML escaping
  ------------------------------------------------------------
*/

function escapeHtml(value) {

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

</script>

</body>
</html>
