  <!-- =========================================================
       BASE / VIEM
       ========================================================= -->  <script type="module">

    import {
      createWalletClient,
      custom
    } from "https://esm.sh/viem@2";

    import {
      base
    } from "https://esm.sh/viem@2/chains";

    import {
      Attribution
    } from "https://esm.sh/ox@0.9.0/erc8021";


    /*
     * ==========================================================
     * ROCKY'S BUILDER CODE
     * ==========================================================
     */

    const BUILDER_CODE = "bc_q8bj3kjd";


    /*
     * Convert Builder Code into the ERC-8021 data suffix.
     */

    const DATA_SUFFIX = Attribution.toDataSuffix({
      codes: [BUILDER_CODE]
    });


    /*
     * Wallet variables
     */

    let walletClient = null;
    let connectedAddress = null;


    /*
     * Page elements
     */

    const connectButton =
      document.getElementById("connectButton");

    const openMetaMaskButton =
      document.getElementById("openMetaMaskButton");

    const testButton =
      document.getElementById("testButton");

    const walletAddress =
      document.getElementById("walletAddress");

    const status =
      document.getElementById("status");

    const txLink =
      document.getElementById("txLink");


    /*
     * ==========================================================
     * DETECT WALLET
     * ==========================================================
     */

    function hasEthereumProvider() {

      return (
        typeof window.ethereum !== "undefined"
      );

    }


    /*
     * ==========================================================
     * OPEN THIS WEBSITE INSIDE METAMASK
     *
     * This is particularly useful on Android when the site
     * is opened in Chrome and window.ethereum is unavailable.
     * ==========================================================
     */

    function openMetaMask() {

      const currentUrl =
        window.location.href;

      const metamaskUrl =
        "https://metamask.app.link/dapp/" +
        currentUrl.replace(/^https?:\/\//, "");

      window.location.href =
        metamaskUrl;

    }


    /*
     * ==========================================================
     * CONNECT WALLET
     * ==========================================================
     */

    async function connectWallet() {

      txLink.textContent = "";
      txLink.removeAttribute("href");

      /*
       * Android Chrome may not have an injected wallet.
       */

      if (!hasEthereumProvider()) {

        status.textContent =
          "MetaMask was not detected. Tap 'Open in MetaMask'.";

        openMetaMaskButton.style.display =
          "inline-block";

        return;

      }


      try {

        status.textContent =
          "Opening MetaMask...";


        /*
         * Create Viem wallet client using MetaMask's
         * injected Ethereum provider.
         *
         * dataSuffix attaches Rocky's Builder Code
         * to supported transactions.
         */

        walletClient =
          createWalletClient({

            chain: base,

            transport:
              custom(window.ethereum),

            dataSuffix:
              DATA_SUFFIX

          });


        /*
         * Explicitly ask MetaMask for account access.
         */

        const accounts =
          await walletClient.requestAddresses();


        if (
          !accounts ||
          accounts.length === 0
        ) {

          throw new Error(
            "No wallet account was returned."
          );

        }


        connectedAddress =
          accounts[0];


        /*
         * Make sure MetaMask is on Base.
         */

        try {

          await walletClient.switchChain({
            id: base.id
          });

        } catch (switchError) {

          /*
           * Some wallets handle network switching
           * differently. Try the raw MetaMask method.
           */

          await window.ethereum.request({

            method:
              "wallet_switchEthereumChain",

            params: [
              {
                chainId: "0x2105"
              }
            ]

          });

        }


        /*
         * Display connected wallet.
         */

        const shortenedAddress =
          connectedAddress.slice(0, 6) +
          "..." +
          connectedAddress.slice(-4);


        walletAddress.textContent =
          "Connected: " +
          shortenedAddress;


        status.textContent =
          "Connected to Base • Builder Code: " +
          BUILDER_CODE;


        connectButton.textContent =
          "Wallet Connected";


        openMetaMaskButton.style.display =
          "none";


        testButton.style.display =
          "inline-block";


      } catch (error) {

        console.error(
          "Wallet connection error:",
          error
        );


        let message =
          error?.shortMessage ||
          error?.message ||
          "Unknown wallet error.";


        if (
          error?.code === 4001
        ) {

          message =
            "Connection was cancelled in MetaMask.";

        }


        status.textContent =
          "Error: " + message;

      }

    }


    /*
     * ==========================================================
     * CONNECT BUTTON
     * ==========================================================
     */

    connectButton.addEventListener(
      "click",
      connectWallet
    );


    /*
     * ==========================================================
     * OPEN METAMASK BUTTON
     * ==========================================================
     */

    openMetaMaskButton.addEventListener(
      "click",
      openMetaMask
    );


    /*
     * ==========================================================
     * TEST BUILDER CODE
     *
     * Sends a zero-value transaction to the same wallet.
     *
     * IMPORTANT:
     * This is a REAL Base transaction and requires gas.
     *
     * The purpose is ONLY to verify that the transaction
     * pipeline is working.
     * ==========================================================
     */

    testButton.addEventListener(
      "click",
      async () => {

        if (
          !walletClient ||
          !connectedAddress
        ) {

          status.textContent =
            "Connect your wallet first.";

          return;

        }


        try {

          testButton.disabled =
            true;


          status.textContent =
            "Confirm the Base transaction in MetaMask...";


          txLink.textContent = "";


          /*
           * Builder Code is automatically added by
           * the Wallet Client's dataSuffix.
           */

          const hash =
            await walletClient.sendTransaction({

              account:
                connectedAddress,

              to:
                connectedAddress,

              value:
                0n

            });


          status.textContent =
            "Transaction submitted successfully.";


          txLink.textContent =
            "View transaction on BaseScan";


          txLink.href =
            "https://basescan.org/tx/" +
            hash;


          console.log(
            "Builder Code:",
            BUILDER_CODE
          );


          console.log(
            "ERC-8021 Data Suffix:",
            DATA_SUFFIX
          );


          console.log(
            "Transaction Hash:",
            hash
          );


        } catch (error) {

          console.error(
            "Transaction error:",
            error
          );


          let message =
            error?.shortMessage ||
            error?.message ||
            "Transaction failed.";


          if (
            error?.code === 4001
          ) {

            message =
              "Transaction cancelled in MetaMask.";

          }


          status.textContent =
            message;


        } finally {

          testButton.disabled =
            false;

        }

      }
    );


    /*
     * ==========================================================
     * AUTOMATIC WALLET EVENT HANDLING
     * ==========================================================
     */

    if (hasEthereumProvider()) {

      window.ethereum.on(
        "accountsChanged",
        (accounts) => {

          if (
            !accounts ||
            accounts.length === 0
          ) {

            connectedAddress = null;

            walletAddress.textContent =
              "";

            status.textContent =
              "Wallet disconnected.";

            testButton.style.display =
              "none";

            connectButton.textContent =
              "Connect MetaMask";

          } else {

            connectedAddress =
              accounts[0];

            walletAddress.textContent =
              "Connected: " +
              connectedAddress.slice(0, 6) +
              "..." +
              connectedAddress.slice(-4);

          }

        }
      );


      window.ethereum.on(
        "chainChanged",
        () => {

          status.textContent =
            "Network changed. Base is required for this site.";

        }
      );

    }


    /*
     * ==========================================================
     * INITIAL ANDROID DETECTION
     * ==========================================================
     */

    if (!hasEthereumProvider()) {

      /*
       * Give Android Chrome users an obvious
       * way to open the page in MetaMask.
       */

      openMetaMaskButton.style.display =
        "inline-block";

      status.textContent =
        "For Android: open this page in MetaMask to connect your wallet.";

    }


  </script>  <!-- =========================================================
       PONG GAME
       ========================================================= -->  <script>

    const canvas =
      document.getElementById("gameCanvas");

    const ctx =
      canvas.getContext("2d");


    const paddleWidth = 10;
    const paddleHeight = 80;


    let playerY =
      canvas.height / 2 -
      paddleHeight / 2;


    let aiY =
      canvas.height / 2 -
      paddleHeight / 2;


    let ballX =
      canvas.width / 2;


    let ballY =
      canvas.height / 2;


    let ballSpeedX = 5;
    let ballSpeedY = 4;


    const keys = {};


    /*
     * Keyboard controls
     */

    document.addEventListener(
      "keydown",
      (e) => {

        keys[
          e.key.toLowerCase()
        ] = true;

      }
    );


    document.addEventListener(
      "keyup",
      (e) => {

        keys[
          e.key.toLowerCase()
        ] = false;

      }
    );


    /*
     * Mobile touch controls
     */

    canvas.addEventListener(
      "touchmove",
      (e) => {

        e.preventDefault();


        const rect =
          canvas.getBoundingClientRect();


        const touchY =
          e.touches[0].clientY -
          rect.top;


        playerY =
          touchY -
          paddleHeight / 2;


        if (playerY < 0) {

          playerY = 0;

        }


        if (
          playerY >
          canvas.height -
          paddleHeight
        ) {

          playerY =
            canvas.height -
            paddleHeight;

        }

      },
      {
        passive: false
      }
    );


    function drawRect(
      x,
      y,
      w,
      h,
      color
    ) {

      ctx.fillStyle =
        color;

      ctx.fillRect(
        x,
        y,
        w,
        h
      );

    }


    function drawBall(
      x,
      y,
      r,
      color
    ) {

      ctx.fillStyle =
        color;

      ctx.beginPath();

      ctx.arc(
        x,
        y,
        r,
        0,
        Math.PI * 2
      );

      ctx.fill();

    }


    function update() {

      /*
       * Player movement
       */

      if (
        keys["w"] &&
        playerY > 0
      ) {

        playerY -= 6;

      }


      if (
        keys["s"] &&
        playerY <
          canvas.height -
          paddleHeight
      ) {

        playerY += 6;

      }


      /*
       * AI movement
       */

      const aiCenter =
        aiY +
        paddleHeight / 2;


      if (
        aiCenter <
        ballY - 20
      ) {

        aiY += 4;

      } else if (
        aiCenter >
        ballY + 20
      ) {

        aiY -= 4;

      }


      /*
       * Ball movement
       */

      ballX +=
        ballSpeedX;

      ballY +=
        ballSpeedY;


      /*
       * Top/bottom bounce
       */

      if (
        ballY <= 0 ||
        ballY >= canvas.height
      ) {

        ballSpeedY *= 1;

      }


      /*
       * Player paddle collision
       */

      if (
        ballX <= 20 &&
        ballY > playerY &&
        ballY <
          playerY +
          paddleHeight
      ) {

        ballSpeedX *= 1;

      }


      /*
       * AI paddle collision
       */

      if (
        ballX >=
          canvas.width - 20 &&
        ballY > aiY &&
        ballY <
          aiY +
          paddleHeight
      ) {

        ballSpeedX *= 1;

      }


      /*
       * Reset ball
       */

      if (
        ballX < 0 ||
        ballX > canvas.width
      ) {

        ballX =
          canvas.width / 2;

        ballY =
          canvas.height / 2;

        ballSpeedX *= 1;

      }

    }


    function draw() {

      /*
       * Background
       */

      drawRect(
        0,
        0,
        canvas.width,
        canvas.height,
        "black"
      );


      /*
       * Center line
       */

      for (
        let i = 0;
        i < canvas.height;
        i += 20
      ) {

        drawRect(
          canvas.width / 2 - 1,
          i,
          2,
          10,
          "#333"
        );

      }


      /*
       * Player paddle
       */

      drawRect(
        10,
        playerY,
        paddleWidth,
        paddleHeight,
        "#0052FF"
      );


      /*
       * AI paddle
       */

      drawRect(
        canvas.width - 20,
        aiY,
        paddleWidth,
        paddleHeight,
        "#0052FF"
      );


      /*
       * Ball
       */

      drawBall(
        ballX,
        ballY,
        8,
        "red"
      );

    }


    function gameLoop() {

      update();

      draw();

      requestAnimationFrame(
        gameLoop
      );

    }


    gameLoop();

  </script></body>
