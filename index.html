<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Rocky's Base Project</title>

  <!-- Base App -->
  <meta name="base:app_id" content="698d6ec5b3590846b38398f8">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #050505;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .container {
      max-width: 600px;
      margin: auto;
      padding: 35px 20px;
    }

    h1 {
      color: #3b82f6;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #aaa;
      margin-bottom: 30px;
    }

    button {
      width: 100%;
      padding: 15px;
      margin: 8px 0;
      border: 0;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
    }

    .wallet {
      background: #111;
      border: 1px solid #333;
      border-radius: 15px;
      padding: 20px;
      margin-bottom: 25px;
    }

    #status {
      word-break: break-all;
      color: #aaa;
      margin: 12px 0;
      font-size: 14px;
    }

    #message {
      min-height: 24px;
      margin-top: 15px;
      color: #60a5fa;
      word-break: break-word;
    }

    #game {
      margin-top: 25px;
      border: 2px solid #2563eb;
      border-radius: 10px;
      width: 100%;
      max-width: 500px;
      height: 300px;
      background: black;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Rocky's Base Project</h1>

  <div class="subtitle">
    Base + MetaMask + Builder Code
  </div>

  <div class="wallet">

    <div id="status">
      Wallet not connected
    </div>

    <button id="connectBtn">
      Connect MetaMask
    </button>

    <button id="testBtn" disabled>
      Test Builder Code
    </button>

    <div id="message"></div>

  </div>

  <canvas id="game" width="500" height="300"></canvas>

</div>


<script type="module">

/*
========================================================
  METAMASK CONNECT
========================================================
*/

import { createEVMClient } from
  "https://esm.sh/@metamask/connect-evm";


/*
========================================================
  SETTINGS
========================================================
*/

const BASE_CHAIN_ID = "0x2105";

// Your Base Builder Code
const BUILDER_CODE = "bc_q8bj3kjd";

// ERC-8021 schema 0 suffix for your Builder Code
const BUILDER_SUFFIX =
  "0x62635f7138626a336b6a640b0080218021802180218021802180218021";


/*
========================================================
  PAGE ELEMENTS
========================================================
*/

const connectBtn = document.getElementById("connectBtn");
const testBtn = document.getElementById("testBtn");
const status = document.getElementById("status");
const message = document.getElementById("message");


/*
========================================================
  METAMASK CONNECT CLIENT
========================================================
*/

let evmClient = null;
let provider = null;
let account = null;


/*
========================================================
  INITIALIZE
========================================================
*/

async function initializeWallet() {

  try {

    message.textContent = "Loading MetaMask...";

    evmClient = await createEVMClient({

      dapp: {
        name: "Rocky's Base Project",
        url: window.location.href
      },

      api: {

        supportedNetworks: {

          [BASE_CHAIN_ID]:
            "https://mainnet.base.org"

        }

      }

    });

    provider = evmClient.getProvider();

    provider.on("accountsChanged", accounts => {

      if (!accounts || accounts.length === 0) {

        account = null;

        status.textContent =
          "Wallet not connected";

        testBtn.disabled = true;

        return;

      }

      account = accounts[0];

      showConnected();

    });

    provider.on("chainChanged", chainId => {

      if (chainId !== BASE_CHAIN_ID) {

        status.innerHTML =
          "Connected, but please switch to Base.";

      } else {

        showConnected();

      }

    });

    message.textContent =
      "Ready to connect.";

  } catch (error) {

    console.error(error);

    message.textContent =
      "MetaMask initialization failed: " +
      (error.message || error);

  }

}


/*
========================================================
  CONNECT WALLET
========================================================
*/

async function connectWallet() {

  try {

    connectBtn.disabled = true;

    message.textContent =
      "Opening MetaMask...";

    /*
      MetaMask Connect handles mobile browsers
      and opens the MetaMask mobile app.
    */

    const result = await evmClient.connect({

      chainIds: [BASE_CHAIN_ID],

      forceRequest: true

    });

    account = result.accounts[0];

    showConnected();

    message.textContent =
      "MetaMask connected successfully.";

  } catch (error) {

    console.error(error);

    if (error.code === 4001) {

      message.textContent =
        "Connection cancelled.";

    } else {

      message.textContent =
        "Connection error: " +
        (error.message || error);

    }

  } finally {

    connectBtn.disabled = false;

  }

}


/*
========================================================
  SHOW CONNECTED
========================================================
*/

function showConnected() {

  if (!account) return;

  status.innerHTML =
    "<strong>Connected</strong><br>" +
    account;

  connectBtn.textContent =
    "MetaMask Connected";

  testBtn.disabled = false;

}


/*
========================================================
  TEST BUILDER CODE
========================================================
*/

async function testBuilderCode() {

  if (!provider || !account) {

    message.textContent =
      "Connect MetaMask first.";

    return;

  }

  try {

    testBtn.disabled = true;

    message.textContent =
      "Opening MetaMask transaction confirmation...";


    /*
      A zero-value transaction to the connected wallet.

      The ERC-8021 Builder Code is supplied through
      wallet_sendCalls using the dataSuffix capability.
    */

    const response = await provider.request({

      method: "wallet_sendCalls",

      params: [{

        version: "1",

        from: account,

        chainId: BASE_CHAIN_ID,

        atomicRequired: false,

        calls: [{

          to: account,

          value: "0x0",

          data: "0x"

        }],

        capabilities: {

          dataSuffix: {

            value: BUILDER_SUFFIX,

            optional: true

          }

        }

      }]

    });


    console.log(
      "Builder Code:",
      BUILDER_CODE
    );

    console.log(
      "wallet_sendCalls response:",
      response
    );


    message.innerHTML =
      "Builder Code transaction submitted.<br><br>" +
      "Code: " + BUILDER_CODE;


  } catch (error) {

    console.error(error);

    message.textContent =
      "Transaction error: " +
      (error.message || error);

  } finally {

    testBtn.disabled = false;

  }

}


/*
========================================================
  BUTTONS
========================================================
*/

connectBtn.addEventListener(
  "click",
  connectWallet
);

testBtn.addEventListener(
  "click",
  testBuilderCode
);


/*
========================================================
  START
========================================================
*/

initializeWallet();


/*
========================================================
  SIMPLE PONG GAME
========================================================
*/

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let ballX = 250;
let ballY = 150;

let ballDX = 3;
let ballDY = 3;

let paddleY = 125;

function gameLoop() {

  ctx.fillStyle = "black";
  ctx.fillRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  ctx.fillStyle = "#2563eb";

  ctx.fillRect(
    10,
    paddleY,
    10,
    50
  );

  ctx.beginPath();

  ctx.arc(
    ballX,
    ballY,
    7,
    0,
    Math.PI * 2
  );

  ctx.fill();

  ballX += ballDX;
  ballY += ballDY;

  if (
    ballY <= 7 ||
    ballY >= canvas.height - 7
  ) {

    ballDY *= -1;

  }

  if (
    ballX <= 20 &&
    ballY >= paddleY &&
    ballY <= paddleY + 50
  ) {

    ballDX *= -1;

  }

  if (
    ballX >= canvas.width - 7
  ) {

    ballX = 250;
    ballY = 150;

  }

  requestAnimationFrame(gameLoop);

}

document.addEventListener(
  "mousemove",
  event => {

    const rect =
      canvas.getBoundingClientRect();

    paddleY =
      event.clientY -
      rect.top -
      25;

    paddleY =
      Math.max(
        0,
        Math.min(
          canvas.height - 50,
          paddleY
        )
      );

  }
);

gameLoop();

</script>

</body>
</html>
