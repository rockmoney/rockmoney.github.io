<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Rocky's Base Project</title>

  <meta
    name="base:app_id"
    content="698d6ec5b3590846b38398f8"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #050505;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .container {
      width: 100%;
      max-width: 600px;
      margin: auto;
      padding: 35px 20px;
    }

    h1 {
      color: #3b82f6;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #aaa;
      margin-bottom: 30px;
    }

    .wallet {
      background: #111;
      border: 1px solid #333;
      border-radius: 15px;
      padding: 20px;
      margin-bottom: 25px;
    }

    button {
      width: 100%;
      padding: 15px;
      margin: 8px 0;
      border: 0;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #status {
      word-break: break-all;
      color: #aaa;
      margin: 12px 0;
      font-size: 14px;
      line-height: 1.5;
    }

    #message {
      min-height: 24px;
      margin-top: 15px;
      color: #60a5fa;
      word-break: break-word;
      line-height: 1.5;
    }

    #game {
      margin-top: 25px;
      border: 2px solid #2563eb;
      border-radius: 10px;
      width: 100%;
      max-width: 500px;
      height: 300px;
      background: black;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Rocky's Base Project</h1>

  <div class="subtitle">
    Base + MetaMask + ERC-8021 Builder Code
  </div>

  <div class="wallet">

    <div id="status">
      Wallet not connected
    </div>

    <button id="connectBtn">
      Connect MetaMask
    </button>

    <button id="switchBtn" disabled>
      Switch to Base
    </button>

    <button id="testBtn" disabled>
      Test Builder Code
    </button>

    <div id="message"></div>

  </div>

  <canvas
    id="game"
    width="500"
    height="300">
  </canvas>

</div>


<script type="module">

/* =====================================================
   METAMASK CONNECT
===================================================== */

import {
  createEVMClient
} from "https://esm.sh/@metamask/connect-evm";


/* =====================================================
   NETWORK
===================================================== */

const ETHEREUM_CHAIN_ID = "0x1";

const BASE_CHAIN_ID = "0x2105";

const BASE_RPC =
  "https://mainnet.base.org";


/* =====================================================
   YOUR BUILDER CODE
===================================================== */

const BUILDER_CODE =
  "bc_q8bj3kjd";


/* =====================================================
   ERC-8021 BUILDER CODE SUFFIX
=====================================================

   Builder Code:
   bc_q8bj3kjd

   UTF-8 hex:
   62635f7138626a336b6a64

   Length:
   0b

   Schema ID:
   00

   ERC-8021 marker:
   80218021802180218021802180218021

===================================================== */

const BUILDER_SUFFIX =
  "0x" +
  "62635f7138626a336b6a64" +
  "0b" +
  "00" +
  "80218021802180218021802180218021";


/* =====================================================
   BASE USDC CONTRACT
=====================================================

   Base USDC:

   0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913

===================================================== */

const USDC =
  "0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913";


/* =====================================================
   PAGE ELEMENTS
===================================================== */

const connectBtn =
  document.getElementById("connectBtn");

const switchBtn =
  document.getElementById("switchBtn");

const testBtn =
  document.getElementById("testBtn");

const status =
  document.getElementById("status");

const message =
  document.getElementById("message");


/* =====================================================
   WALLET VARIABLES
===================================================== */

let evmClient = null;

let provider = null;

let account = null;

let currentChain = null;


/* =====================================================
   ERROR HANDLING
===================================================== */

function getErrorMessage(error) {

  if (!error) {
    return "Unknown error";
  }

  if (error.message) {
    return error.message;
  }

  if (error.rpcMessage) {
    return error.rpcMessage;
  }

  return String(error);
}


/* =====================================================
   INITIALIZE METAMASK CONNECT
===================================================== */

async function initializeWallet() {

  try {

    message.textContent =
      "Loading MetaMask...";


    evmClient =
      await createEVMClient({

        dapp: {

          name:
            "Rocky's Base Project",

          url:
            window.location.href

        },

        api: {

          supportedNetworks: {

            /*
              Ethereum is included so MetaMask
              can handle an existing Mainnet session.
            */

            "0x1":
              "https://cloudflare-eth.com",

            /*
              Base Mainnet
            */

            "0x2105":
              BASE_RPC

          }

        }

      });


    provider =
      evmClient.getProvider();


    provider.on(
      "accountsChanged",
      handleAccountsChanged
    );


    provider.on(
      "chainChanged",
      handleChainChanged
    );


    /*
      Read current chain directly.
    */

    try {

      currentChain =
        await provider.request({
          method: "eth_chainId"
        });

    } catch (error) {

      currentChain = null;

    }


    updateWalletDisplay();


    message.textContent =
      "Ready.";

  } catch (error) {

    console.error(error);

    message.textContent =
      "MetaMask initialization failed: " +
      getErrorMessage(error);

  }

}


/* =====================================================
   CONNECT
===================================================== */

async function connectWallet() {

  try {

    connectBtn.disabled = true;

    message.textContent =
      "Opening MetaMask...";


    const result =
      await evmClient.connect({

        chainIds: [
          ETHEREUM_CHAIN_ID,
          BASE_CHAIN_ID
        ],

        forceRequest: true

      });


    account =
      result.accounts[0];


    /*
      Read actual current chain.
    */

    try {

      currentChain =
        await provider.request({
          method: "eth_chainId"
        });

    } catch (error) {

      currentChain =
        result.chainId;

    }


    /*
      Force Base.
    */

    if (
      currentChain !== BASE_CHAIN_ID
    ) {

      await switchToBase();

    }


    updateWalletDisplay();


    if (
      currentChain === BASE_CHAIN_ID
    ) {

      message.textContent =
        "Connected to Base.";

    }

  } catch (error) {

    console.error(error);

    message.textContent =
      "Connection error: " +
      getErrorMessage(error);

  } finally {

    connectBtn.disabled = false;

  }

}


/* =====================================================
   SWITCH TO BASE
===================================================== */

async function switchToBase() {

  try {

    switchBtn.disabled = true;

    message.textContent =
      "Switching MetaMask to Base...";


    await evmClient.switchChain({

      chainId:
        BASE_CHAIN_ID,

      chainConfiguration: {

        chainName:
          "Base",

        nativeCurrency: {

          name:
            "Ether",

          symbol:
            "ETH",

          decimals:
            18

        },

        rpcUrls: [
          BASE_RPC
        ],

        blockExplorerUrls: [
          "https://basescan.org"
        ]

      }

    });


    currentChain =
      BASE_CHAIN_ID;


    updateWalletDisplay();


    message.textContent =
      "MetaMask is now on Base.";

  } catch (error) {

    console.error(error);

    message.textContent =
      "Could not switch to Base: " +
      getErrorMessage(error);

  } finally {

    switchBtn.disabled = false;

  }

}


/* =====================================================
   ACCOUNT CHANGED
===================================================== */

function handleAccountsChanged(accounts) {

  if (
    !accounts ||
    accounts.length === 0
  ) {

    account = null;

    updateWalletDisplay();

    return;

  }


  account =
    accounts[0];

  updateWalletDisplay();

}


/* =====================================================
   CHAIN CHANGED
===================================================== */

function handleChainChanged(chainId) {

  currentChain =
    chainId;

  updateWalletDisplay();

}


/* =====================================================
   UPDATE DISPLAY
===================================================== */

function updateWalletDisplay() {

  if (!account) {

    status.textContent =
      "Wallet not connected";

    connectBtn.textContent =
      "Connect MetaMask";

    switchBtn.disabled =
      true;

    testBtn.disabled =
      true;

    return;

  }


  if (
    currentChain === BASE_CHAIN_ID
  ) {

    status.innerHTML =
      "<strong>Connected to Base</strong><br><br>" +
      account;

    connectBtn.textContent =
      "MetaMask Connected";

    switchBtn.disabled =
      true;

    testBtn.disabled =
      false;

  } else {

    status.innerHTML =
      "<strong>Wallet Connected</strong><br><br>" +
      account +
      "<br><br>" +
      "<strong>Current chain:</strong> " +
      (currentChain || "Unknown") +
      "<br><br>" +
      "Base is required.";

    connectBtn.textContent =
      "MetaMask Connected";

    switchBtn.disabled =
      false;

    testBtn.disabled =
      true;

  }

}


/* =====================================================
   BUILD USDC approve(address,0) CALL
=====================================================

   Function:

   approve(address spender, uint256 amount)

   Selector:

   0x095ea7b3

   spender:

   YOUR CONNECTED WALLET

   amount:

   0

   This does NOT transfer USDC.

===================================================== */

function buildZeroApproveCall() {

  /*
    Remove 0x from address.
  */

  const spender =
    account
      .toLowerCase()
      .replace("0x", "");


  /*
    Pad address to 32 bytes.
  */

  const paddedSpender =
    spender.padStart(64, "0");


  /*
    uint256(0)
  */

  const zeroAmount =
    "0".repeat(64);


  /*
    approve(address,uint256)
  */

  const calldata =
    "0x" +
    "095ea7b3" +
    paddedSpender +
    zeroAmount;


  return calldata;

}


/* =====================================================
   TEST ERC-8021 BUILDER CODE
===================================================== */

async function testBuilderCode() {

  if (!provider) {

    message.textContent =
      "MetaMask is not connected.";

    return;

  }


  if (!account) {

    message.textContent =
      "Connect MetaMask first.";

    return;

  }


  if (
    currentChain !== BASE_CHAIN_ID
  ) {

    message.textContent =
      "Switch to Base first.";

    return;

  }


  try {

    testBtn.disabled = true;

    message.textContent =
      "Preparing Base contract transaction...";


    /*
      Build a real USDC contract call.

      approve(your wallet, 0)

      No USDC is transferred.
    */

    const callData =
      buildZeroApproveCall();


    console.log(
      "USDC contract:",
      USDC
    );

    console.log(
      "Call data:",
      callData
    );

    console.log(
      "Builder Code:",
      BUILDER_CODE
    );

    console.log(
      "Builder suffix:",
      BUILDER_SUFFIX
    );


    message.textContent =
      "Opening MetaMask for confirmation...";


    /*
      EIP-5792 wallet_sendCalls

      MetaMask currently reports that this
      provider requires version 2.0.0.
    */

    const response =
      await provider.request({

        method:
          "wallet_sendCalls",

        params: [{

          version:
            "2.0.0",

          from:
            account,

          chainId:
            BASE_CHAIN_ID,

          atomicRequired:
            false,

          calls: [{

            /*
              Base USDC contract
            */

            to:
              USDC,

            /*
              No ETH
            */

            value:
              "0x0",

            /*
              approve(wallet,0)
            */

            data:
              callData

          }],

          /*
            ERC-8021 Builder Code
          */

          capabilities: {

            dataSuffix: {

              value:
                BUILDER_SUFFIX,

              optional:
                true

            }

          }

        }]

      });


    console.log(
      "wallet_sendCalls response:",
      response
    );


    const bundleId =
      typeof response === "string"
        ? response
        : (
            response?.id ||
            response?.bundleId ||
            response?.callId
          );


    if (bundleId) {

      message.innerHTML =
        "Transaction submitted.<br><br>" +
        "<strong>Builder Code:</strong><br>" +
        BUILDER_CODE +
        "<br><br>" +
        "<strong>Call ID:</strong><br>" +
        bundleId;

    } else {

      message.innerHTML =
        "Transaction submitted.<br><br>" +
        "<strong>Builder Code:</strong><br>" +
        BUILDER_CODE;

    }

  } catch (error) {

    console.error(error);

    message.textContent =
      "Transaction error: " +
      getErrorMessage(error);

  } finally {

    testBtn.disabled = false;

  }

}


/* =====================================================
   BUTTONS
===================================================== */

connectBtn.addEventListener(
  "click",
  connectWallet
);

switchBtn.addEventListener(
  "click",
  switchToBase
);

testBtn.addEventListener(
  "click",
  testBuilderCode
);


/* =====================================================
   START WALLET
===================================================== */

initializeWallet();


/* =====================================================
   PONG GAME
===================================================== */

const canvas =
  document.getElementById("game");

const ctx =
  canvas.getContext("2d");

let ballX = 250;
let ballY = 150;

let ballDX = 3;
let ballDY = 3;

let paddleY = 125;


/* =====================================================
   GAME LOOP
===================================================== */

function gameLoop() {

  ctx.fillStyle =
    "black";

  ctx.fillRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  ctx.fillStyle =
    "#2563eb";

  ctx.fillRect(
    10,
    paddleY,
    10,
    50
  );


  ctx.beginPath();

  ctx.arc(
    ballX,
    ballY,
    7,
    0,
    Math.PI * 2
  );

  ctx.fill();


  ballX += ballDX;
  ballY += ballDY;


  if (
    ballY <= 7 ||
    ballY >= canvas.height - 7
  ) {

    ballDY *= -1;

  }


  if (
    ballX <= 20 &&
    ballY >= paddleY &&
    ballY <= paddleY + 50
  ) {

    ballDX *= -1;

  }


  if (
    ballX >= canvas.width - 7
  ) {

    ballX = 250;
    ballY = 150;

  }


  requestAnimationFrame(
    gameLoop
  );

}


/* =====================================================
   MOUSE CONTROL
===================================================== */

document.addEventListener(
  "mousemove",
  event => {

    const rect =
      canvas.getBoundingClientRect();

    paddleY =
      event.clientY -
      rect.top -
      25;

    paddleY =
      Math.max(
        0,
        Math.min(
          canvas.height - 50,
          paddleY
        )
      );

  }
);


/* =====================================================
   START GAME
===================================================== */

gameLoop();

</script>

</body>
</html>
