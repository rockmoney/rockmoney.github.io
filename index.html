<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Base ERC-8021 Test</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 760px;
      margin: auto;
      padding: 24px;
      background: #111;
      color: #fff;
    }

    h1 {
      font-size: 25px;
      margin-bottom: 8px;
    }

    .description {
      color: #aaa;
      line-height: 1.5;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-top: 18px;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 13px;
      border-radius: 8px;
      border: 1px solid #444;
      background: #1c1c1c;
      color: #fff;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 18px;
      padding: 14px;
      border: 0;
      border-radius: 8px;
      background: #fff;
      color: #000;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    .box {
      margin-top: 18px;
      padding: 15px;
      border: 1px solid #333;
      border-radius: 8px;
      background: #1a1a1a;
      line-height: 1.55;
    }

    .good {
      color: #55e68a;
    }

    .bad {
      color: #ff6868;
    }

    .muted {
      color: #999;
    }

    code {
      word-break: break-all;
      color: #ddd;
    }

    a {
      color: #72a7ff;
    }

    hr {
      border: 0;
      border-top: 1px solid #333;
      margin: 18px 0;
    }
  </style>
</head>

<body>

<h1>Base ERC-8021 Attribution Test</h1>

<div class="description">
  Sends a zero-value USDC transfer to your own wallet on Base Mainnet
  with an ERC-8021 attribution suffix appended to the calldata.
</div>

<button id="connectButton">
  Connect MetaMask
</button>

<div id="walletBox" class="box">
  Wallet: Not connected
</div>

<label for="builderCode">
  Builder Code
</label>

<input
  id="builderCode"
  type="text"
  value="baseapp"
  maxlength="32"
  placeholder="Enter your Base Builder Code"
>

<div class="box muted">
  Replace <code>baseapp</code> with your own registered Base Builder Code
  if you have one.
</div>

<button id="prepareButton" disabled>
  Prepare ERC-8021 Transaction
</button>

<div id="details" class="box" style="display:none;"></div>

<button id="sendButton" disabled>
  Send Test Transaction
</button>

<div id="status" class="box">
  Status: Connect MetaMask to begin.
</div>


<script>

"use strict";


/*
============================================================
CONFIGURATION
============================================================
*/


/*
Base Mainnet
*/
const BASE_CHAIN_ID = "0x2105";


/*
Native USDC on Base

This is a CONTRACT address.

That is important because an EOA cannot be used as the
destination for this calldata test.
*/
const USDC_BASE =
  "0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913";


/*
ERC-8021 marker.

16 bytes = 32 hexadecimal characters.

8021 repeated eight times.
*/
const ERC8021_MARKER =
  "80218021802180218021802180218021";


/*
ERC-20 transfer selector:

transfer(address,uint256)
*/
const TRANSFER_SELECTOR =
  "a9059cbb";


let provider = null;
let walletAddress = null;
let preparedData = null;


/*
============================================================
ELEMENTS
============================================================
*/

const connectButton =
  document.getElementById("connectButton");

const prepareButton =
  document.getElementById("prepareButton");

const sendButton =
  document.getElementById("sendButton");

const builderCodeInput =
  document.getElementById("builderCode");

const walletBox =
  document.getElementById("walletBox");

const details =
  document.getElementById("details");

const statusBox =
  document.getElementById("status");


/*
============================================================
UTILITY FUNCTIONS
============================================================
*/


function strip0x(value) {

  if (value.startsWith("0x")) {
    return value.slice(2);
  }

  return value;
}


function escapeHtml(value) {

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


function shortAddress(address) {

  return (
    address.slice(0, 6) +
    "..." +
    address.slice(-4)
  );
}


function setStatus(message, good = false, bad = false) {

  statusBox.className = "box";

  if (good) {
    statusBox.classList.add("good");
  }

  if (bad) {
    statusBox.classList.add("bad");
  }

  statusBox.innerHTML = message;
}


/*
Convert ASCII Builder Code to hexadecimal.
*/
function asciiToHex(text) {

  let output = "";

  for (let i = 0; i < text.length; i++) {

    const value =
      text.charCodeAt(i);

    if (value > 127) {
      throw new Error(
        "Builder Code must contain ASCII characters only."
      );
    }

    output +=
      value.toString(16).padStart(2, "0");
  }

  return output;
}


/*
Validate Builder Code.
*/
function validateBuilderCode(code) {

  if (!code) {
    throw new Error(
      "Builder Code cannot be empty."
    );
  }

  if (code.length > 255) {
    throw new Error(
      "Builder Code is too long."
    );
  }

  for (let i = 0; i < code.length; i++) {

    const c =
      code.charCodeAt(i);

    if (c < 0x20 || c > 0x7e) {
      throw new Error(
        "Builder Code contains an invalid character."
      );
    }

    /*
    Schema 0 uses comma-separated codes.
    Prevent a comma inside a single code.
    */
    if (code[i] === ",") {
      throw new Error(
        "Builder Code cannot contain a comma."
      );
    }
  }
}


/*
============================================================
ERC-8021 SUFFIX
============================================================

Schema 0 format:

codes
+
codesLength
+
schemaId
+
ERC8021 marker

Example:

baseapp

62617365617070
+
07
+
00
+
80218021802180218021802180218021
*/


function buildERC8021Suffix(builderCode) {

  validateBuilderCode(builderCode);

  const codeHex =
    asciiToHex(builderCode);

  const codeLength =
    builderCode.length
      .toString(16)
      .padStart(2, "0");

  /*
  Schema 0
  */
  const schemaId = "00";

  const suffix =
    codeHex +
    codeLength +
    schemaId +
    ERC8021_MARKER;

  return "0x" + suffix;
}


/*
============================================================
ABI ENCODING
============================================================
*/


/*
Encode an Ethereum address into a 32-byte ABI word.
*/
function encodeAddress(address) {

  const clean =
    strip0x(address);

  if (clean.length !== 40) {
    throw new Error(
      "Invalid Ethereum address."
    );
  }

  return clean.padStart(64, "0");
}


/*
Encode uint256 zero.
*/
function encodeUint256Zero() {

  return "0".repeat(64);
}


/*
============================================================
BUILD TRANSACTION
============================================================
*/


function buildTransactionData(builderCode) {

  /*
  Base ERC-20 transfer:

  transfer(yourWallet, 0)

  Selector:
  a9059cbb

  Address:
  32-byte ABI word

  Amount:
  32-byte uint256 zero
  */

  const transferCalldata =
    TRANSFER_SELECTOR +
    encodeAddress(walletAddress) +
    encodeUint256Zero();


  /*
  Build ERC-8021 suffix.
  */

  const suffix =
    strip0x(
      buildERC8021Suffix(builderCode)
    );


  /*
  CRITICAL:

  ERC-8021 is appended AFTER the valid
  contract calldata.

  It is NOT inserted inside the
  transfer() arguments.
  */

  const completeData =
    "0x" +
    transferCalldata +
    suffix;


  return {
    transferCalldata:
      "0x" + transferCalldata,

    suffix:
      "0x" + suffix,

    completeData:
      completeData
  };
}


/*
============================================================
VERIFY ERC-8021
============================================================
*/


function verifyMarker(data) {

  const clean =
    strip0x(data).toLowerCase();

  const final32 =
    clean.slice(-32);

  return (
    final32 ===
    ERC8021_MARKER.toLowerCase()
  );
}


function getFinal16Bytes(data) {

  const clean =
    strip0x(data);

  return clean.slice(-32);
}


/*
============================================================
CONNECT WALLET
============================================================
*/


connectButton.addEventListener(
  "click",
  async function() {

    try {

      if (!window.ethereum) {

        throw new Error(
          "MetaMask was not detected. Open this page in MetaMask."
        );
      }

      provider =
        window.ethereum;


      setStatus(
        "Requesting MetaMask connection..."
      );


      const accounts =
        await provider.request({
          method: "eth_requestAccounts"
        });


      if (
        !accounts ||
        accounts.length === 0
      ) {

        throw new Error(
          "No wallet account returned."
        );
      }


      walletAddress =
        accounts[0];


      /*
      Switch to Base Mainnet.
      */

      try {

        await provider.request({
          method:
            "wallet_switchEthereumChain",

          params: [
            {
              chainId:
                BASE_CHAIN_ID
            }
          ]
        });

      } catch (switchError) {

        /*
        If Base isn't configured,
        request that MetaMask add it.
        */

        if (
          switchError.code === 4902
        ) {

          await provider.request({

            method:
              "wallet_addEthereumChain",

            params: [
              {
                chainId:
                  BASE_CHAIN_ID,

                chainName:
                  "Base",

                nativeCurrency: {
                  name: "Ether",
                  symbol: "ETH",
                  decimals: 18
                },

                rpcUrls: [
                  "https://mainnet.base.org"
                ],

                blockExplorerUrls: [
                  "https://basescan.org"
                ]
              }
            ]
          });

        } else {

          throw switchError;
        }
      }


      /*
      Confirm network.
      */

      const chainId =
        await provider.request({
          method:
            "eth_chainId"
        });


      if (
        chainId.toLowerCase() !==
        BASE_CHAIN_ID.toLowerCase()
      ) {

        throw new Error(
          "MetaMask is not on Base Mainnet."
        );
      }


      walletBox.innerHTML =

        "<strong>Wallet:</strong> " +
        escapeHtml(
          shortAddress(walletAddress)
        ) +

        "<br><br>" +

        "<strong>Network:</strong> " +
        "Base Mainnet (8453)" +

        "<br><br>" +

        "<strong>Contract:</strong> " +
        escapeHtml(USDC_BASE);


      connectButton.textContent =
        "Wallet Connected";

      prepareButton.disabled =
        false;


      setStatus(
        "Connected to Base Mainnet.",
        true
      );


    } catch (error) {

      console.error(error);

      setStatus(
        "Connection error:<br>" +
        escapeHtml(
          error.message ||
          String(error)
        ),
        false,
        true
      );
    }
  }
);


/*
============================================================
PREPARE
============================================================
*/


prepareButton.addEventListener(
  "click",
  async function() {

    try {

      if (!walletAddress) {

        throw new Error(
          "Connect MetaMask first."
        );
      }


      /*
      Make sure we're still on Base.
      */

      const chainId =
        await provider.request({
          method:
            "eth_chainId"
        });


      if (
        chainId.toLowerCase() !==
        BASE_CHAIN_ID.toLowerCase()
      ) {

        throw new Error(
          "Switch MetaMask to Base Mainnet."
        );
      }


      const builderCode =
        builderCodeInput.value.trim();


      /*
      Build:

      transfer(your wallet, 0)
      +
      ERC-8021 suffix
      */

      const result =
        buildTransactionData(
          builderCode
        );


      /*
      Verify the ERC-8021 marker.
      */

      if (
        !verifyMarker(
          result.completeData
        )
      ) {

        throw new Error(
          "ERC-8021 marker verification failed."
        );
      }


      preparedData =
        result.completeData;


      /*
      Display everything so you can
      inspect it before signing.
      */

      details.style.display =
        "block";


      details.innerHTML = `

        <strong>Target Contract</strong><br>
        <code>${escapeHtml(USDC_BASE)}</code>

        <hr>

        <strong>Function</strong><br>
        <code>transfer(address,uint256)</code>

        <hr>

        <strong>Transfer Amount</strong><br>
        <code>0 USDC</code>

        <hr>

        <strong>Recipient</strong><br>
        <code>${escapeHtml(walletAddress)}</code>

        <hr>

        <strong>Builder Code</strong><br>
        <code>${escapeHtml(builderCode)}</code>

        <hr>

        <strong>Normal ABI Calldata</strong><br>
        <code>${escapeHtml(result.transferCalldata)}</code>

        <hr>

        <strong>ERC-8021 Suffix</strong><br>
        <code>${escapeHtml(result.suffix)}</code>

        <hr>

        <strong>Final 16 Bytes</strong><br>
        <code>${escapeHtml(
          getFinal16Bytes(result.completeData)
        )}</code>

        <br><br>

        <span class="good">
          ERC-8021 MARKER VALID
        </span>

        <hr>

        <strong>Complete Transaction Data</strong><br>
        <code>${escapeHtml(result.completeData)}</code>
      `;


      sendButton.disabled =
        false;


      setStatus(
        "Valid contract calldata + ERC-8021 suffix prepared. The final 16 bytes are the required 8021 marker.",
        true
      );


    } catch (error) {

      console.error(error);

      preparedData =
        null;

      sendButton.disabled =
        true;

      setStatus(
        "Preparation error:<br>" +
        escapeHtml(
          error.message ||
          String(error)
        ),
        false,
        true
      );
    }
  }
);


/*
============================================================
SEND
============================================================
*/


sendButton.addEventListener(
  "click",
  async function() {

    try {

      if (!preparedData) {

        throw new Error(
          "Prepare the transaction first."
        );
      }


      /*
      Final network check.
      */

      const chainId =
        await provider.request({
          method:
            "eth_chainId"
        });


      if (
        chainId.toLowerCase() !==
        BASE_CHAIN_ID.toLowerCase()
      ) {

        throw new Error(
          "MetaMask is no longer on Base Mainnet."
        );
      }


      /*
      Final ERC-8021 check.
      */

      if (
        !verifyMarker(preparedData)
      ) {

        throw new Error(
          "ERC-8021 marker is missing."
        );
      }


      /*
      IMPORTANT:

      The destination is a CONTRACT.

      We are NOT sending calldata to
      the user's EOA.

      The transfer amount is zero.
      */

      const transaction = {

        from:
          walletAddress,

        to:
          USDC_BASE,

        value:
          "0x0",

        data:
          preparedData
      };


      setStatus(
        "Opening MetaMask. Review the transaction carefully before confirming..."
      );


      const txHash =
        await provider.request({

          method:
            "eth_sendTransaction",

          params: [
            transaction
          ]
        });


      /*
      Show transaction.
      */

      details.innerHTML += `

        <hr>

        <strong>Transaction Submitted</strong><br>

        <code>
          ${escapeHtml(txHash)}
        </code>

        <br><br>

        <a
          href="https://basescan.org/tx/${encodeURIComponent(txHash)}"
          target="_blank"
          rel="noopener noreferrer"
        >
          Open Transaction on BaseScan
        </a>
      `;


      setStatus(
        "Transaction submitted successfully. Check the transaction input on BaseScan and verify that the final 16 bytes are the ERC-8021 marker.",
        true
      );


      sendButton.disabled =
        true;


    } catch (error) {

      console.error(error);

      setStatus(
        "Transaction error:<br>" +
        escapeHtml(
          error.message ||
          String(error)
        ),
        false,
        true
      );
    }
  }
);


/*
============================================================
ACCOUNT / NETWORK EVENTS
============================================================
*/


if (window.ethereum) {

  window.ethereum.on(
    "accountsChanged",
    function(accounts) {

      if (
        !accounts ||
        accounts.length === 0
      ) {

        walletAddress = null;
        preparedData = null;

        prepareButton.disabled =
          true;

        sendButton.disabled =
          true;

        walletBox.innerHTML =
          "Wallet: Disconnected";

        setStatus(
          "Wallet disconnected."
        );

        return;
      }


      walletAddress =
        accounts[0];

      preparedData =
        null;

      sendButton.disabled =
        true;

      walletBox.innerHTML =
        "<strong>Wallet:</strong> " +
        escapeHtml(
          shortAddress(walletAddress)
        );

    }
  );


  window.ethereum.on(
    "chainChanged",
    function(chainId) {

      preparedData =
        null;

      sendButton.disabled =
        true;


      if (
        chainId.toLowerCase() !==
        BASE_CHAIN_ID.toLowerCase()
      ) {

        prepareButton.disabled =
          true;

        setStatus(
          "Wrong network. Switch MetaMask back to Base Mainnet.",
          false,
          true
        );

      } else {

        if (walletAddress) {
          prepareButton.disabled =
            false;
        }

        setStatus(
          "Base Mainnet connected.",
          true
        );
      }
    }
  );
}

</script>

</body>
</html>
