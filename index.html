<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Rocky's Base Project</title>

  <meta
    name="base:app_id"
    content="698d6ec5b3590846b38398f8"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #050505;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .container {
      width: 100%;
      max-width: 600px;
      margin: auto;
      padding: 35px 20px;
    }

    h1 {
      color: #3b82f6;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #aaa;
      margin-bottom: 30px;
    }

    .wallet {
      background: #111;
      border: 1px solid #333;
      border-radius: 15px;
      padding: 20px;
      margin-bottom: 25px;
    }

    button {
      width: 100%;
      padding: 15px;
      margin: 8px 0;
      border: 0;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #status {
      word-break: break-all;
      color: #aaa;
      margin: 12px 0;
      font-size: 14px;
      line-height: 1.5;
    }

    #message {
      min-height: 24px;
      margin-top: 15px;
      color: #60a5fa;
      word-break: break-word;
      line-height: 1.5;
    }

    #game {
      margin-top: 25px;
      border: 2px solid #2563eb;
      border-radius: 10px;
      width: 100%;
      max-width: 500px;
      height: 300px;
      background: black;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Rocky's Base Project</h1>

  <div class="subtitle">
    Base + MetaMask + Builder Code
  </div>

  <div class="wallet">

    <div id="status">
      Wallet not connected
    </div>

    <button id="connectBtn">
      Connect MetaMask
    </button>

    <button id="switchBtn" disabled>
      Switch to Base
    </button>

    <button id="testBtn" disabled>
      Test Builder Code
    </button>

    <div id="message"></div>

  </div>

  <canvas
    id="game"
    width="500"
    height="300">
  </canvas>

</div>


<script type="module">

/* =====================================================
   METAMASK CONNECT
===================================================== */

import {
  createEVMClient
} from "https://esm.sh/@metamask/connect-evm";


/* =====================================================
   NETWORKS
===================================================== */

const ETHEREUM_CHAIN_ID = "0x1";

const BASE_CHAIN_ID = "0x2105";


/* =====================================================
   BUILDER CODE
===================================================== */

const BUILDER_CODE = "bc_q8bj3kjd";


/*
  ERC-8021 Schema 0

  Builder Code:
  bc_q8bj3kjd

  Hex:
  62635f7138626a336b6a64

  Length:
  0b

  Schema:
  00

  ERC-8021 marker:
  80218021802180218021802180218021
*/

const BUILDER_SUFFIX =
  "0x" +
  "62635f7138626a336b6a64" +
  "0b" +
  "00" +
  "80218021802180218021802180218021";


/* =====================================================
   BASE RPC
===================================================== */

const BASE_RPC =
  "https://mainnet.base.org";


/* =====================================================
   MULTICALL3
===================================================== */

const MULTICALL3 =
  "0xcA11bde05977b3631167028862bE2a173976CA11";


/*
  Multicall3:
  getCurrentBlockTimestamp()
*/

const CALL_DATA =
  "0x0b3f5e9e";


/* =====================================================
   PAGE ELEMENTS
===================================================== */

const connectBtn =
  document.getElementById("connectBtn");

const switchBtn =
  document.getElementById("switchBtn");

const testBtn =
  document.getElementById("testBtn");

const status =
  document.getElementById("status");

const message =
  document.getElementById("message");


/* =====================================================
   WALLET VARIABLES
===================================================== */

let evmClient = null;

let provider = null;

let account = null;

let currentChain = null;


/* =====================================================
   ERROR MESSAGE
===================================================== */

function getErrorMessage(error) {

  if (!error) {
    return "Unknown error";
  }

  if (error.message) {
    return error.message;
  }

  if (error.rpcMessage) {
    return error.rpcMessage;
  }

  return String(error);
}


/* =====================================================
   INITIALIZE METAMASK CONNECT
===================================================== */

async function initializeWallet() {

  try {

    message.textContent =
      "Loading MetaMask...";


    evmClient =
      await createEVMClient({

        dapp: {

          name:
            "Rocky's Base Project",

          url:
            window.location.href

        },

        api: {

          supportedNetworks: {

            /*
              Ethereum Mainnet is included because
              MetaMask may currently have an existing
              Ethereum session.
            */

            "0x1":
              "https://cloudflare-eth.com",

            /*
              Base Mainnet
            */

            "0x2105":
              BASE_RPC

          }

        }

      });


    provider =
      evmClient.getProvider();


    /*
      Account changes
    */

    provider.on(
      "accountsChanged",
      handleAccountsChanged
    );


    /*
      Network changes
    */

    provider.on(
      "chainChanged",
      handleChainChanged
    );


    /*
      Detect current chain
    */

    try {

      currentChain =
        await evmClient.getChainId();

    } catch (e) {

      currentChain = null;

    }


    message.textContent =
      "Ready.";

  } catch (error) {

    console.error(error);

    message.textContent =
      "MetaMask initialization failed: " +
      getErrorMessage(error);

  }

}


/* =====================================================
   CONNECT WALLET
===================================================== */

async function connectWallet() {

  try {

    connectBtn.disabled = true;

    message.textContent =
      "Opening MetaMask...";


    /*
      Both networks are allowed during the
      MetaMask connection.

      We then explicitly switch to Base.
    */

    const result =
      await evmClient.connect({

        chainIds: [

          ETHEREUM_CHAIN_ID,

          BASE_CHAIN_ID

        ],

        forceRequest: true

      });


    account =
      result.accounts[0];

    currentChain =
      result.chainId;


    /*
      Force Base.
    */

    if (
      currentChain !== BASE_CHAIN_ID
    ) {

      await switchToBase();

    }


    updateWalletDisplay();


    if (
      currentChain === BASE_CHAIN_ID
    ) {

      message.textContent =
        "Connected to Base.";

    }

  } catch (error) {

    console.error(error);

    message.textContent =
      "Connection error: " +
      getErrorMessage(error);

  } finally {

    connectBtn.disabled = false;

  }

}


/* =====================================================
   SWITCH TO BASE
===================================================== */

async function switchToBase() {

  try {

    switchBtn.disabled = true;

    message.textContent =
      "Switching MetaMask to Base...";


    await evmClient.switchChain({

      chainId:
        BASE_CHAIN_ID,

      chainConfiguration: {

        chainName:
          "Base",

        nativeCurrency: {

          name:
            "Ether",

          symbol:
            "ETH",

          decimals:
            18

        },

        rpcUrls: [

          BASE_RPC

        ],

        blockExplorerUrls: [

          "https://basescan.org"

        ]

      }

    });


    currentChain =
      BASE_CHAIN_ID;


    updateWalletDisplay();


    message.textContent =
      "MetaMask is now on Base.";

  } catch (error) {

    console.error(error);

    message.textContent =
      "Could not switch to Base: " +
      getErrorMessage(error);

  } finally {

    switchBtn.disabled = false;

  }

}


/* =====================================================
   ACCOUNT CHANGED
===================================================== */

function handleAccountsChanged(accounts) {

  if (
    !accounts ||
    accounts.length === 0
  ) {

    account = null;

    updateWalletDisplay();

    return;

  }


  account =
    accounts[0];

  updateWalletDisplay();

}


/* =====================================================
   CHAIN CHANGED
===================================================== */

function handleChainChanged(chainId) {

  currentChain =
    chainId;

  updateWalletDisplay();

}


/* =====================================================
   UPDATE WALLET DISPLAY
===================================================== */

function updateWalletDisplay() {

  if (!account) {

    status.textContent =
      "Wallet not connected";

    connectBtn.textContent =
      "Connect MetaMask";

    switchBtn.disabled =
      true;

    testBtn.disabled =
      true;

    return;

  }


  if (
    currentChain === BASE_CHAIN_ID
  ) {

    status.innerHTML =
      "<strong>Connected to Base</strong><br><br>" +
      account;

    connectBtn.textContent =
      "MetaMask Connected";

    switchBtn.disabled =
      true;

    testBtn.disabled =
      false;

  } else {

    status.innerHTML =
      "<strong>Wallet Connected</strong><br><br>" +
      account +
      "<br><br>" +
      "<strong>Current network:</strong> " +
      (currentChain || "Unknown") +
      "<br><br>" +
      "Base is required.";

    connectBtn.textContent =
      "MetaMask Connected";

    switchBtn.disabled =
      false;

    testBtn.disabled =
      true;

  }

}


/* =====================================================
   TEST BUILDER CODE
===================================================== */
async function testBuilderCode() {

  if (!provider) {
    message.textContent =
      "MetaMask is not connected.";
    return;
  }

  if (!account) {
    message.textContent =
      "Connect MetaMask first.";
    return;
  }

  if (currentChain !== BASE_CHAIN_ID) {
    message.textContent =
      "Switch to Base first.";
    return;
  }

  try {

    testBtn.disabled = true;

    message.textContent =
      "Opening MetaMask transaction confirmation...";

    const response =
      await provider.request({

        method: "wallet_sendCalls",

        params: [{

          /*
           * MetaMask requires version 2.0.0
           */
          version: "2.0.0",

          from: account,

          chainId: BASE_CHAIN_ID,

          atomicRequired: false,

          calls: [{

            /*
             * Base Multicall3
             */
            to:
              MULTICALL3,

            value:
              "0x0",

            /*
             * getCurrentBlockTimestamp()
             */
            data:
              CALL_DATA

          }],

          /*
           * ERC-8021 Builder Code
           */
          capabilities: {

            dataSuffix: {

              value:
                BUILDER_SUFFIX,

              optional:
                true

            }

          }

        }]

      });


    console.log(
      "wallet_sendCalls response:",
      response
    );


    /*
     * MetaMask/EIP-5792 normally returns
     * a call bundle ID.
     */
    const bundleId =
      typeof response === "string"
        ? response
        : (
            response?.id ||
            response?.bundleId ||
            response?.callId
          );


    if (bundleId) {

      message.innerHTML =
        "Transaction submitted.<br><br>" +
        "<strong>Builder Code:</strong><br>" +
        BUILDER_CODE +
        "<br><br>" +
        "Call ID:<br>" +
        bundleId;

    } else {

      message.innerHTML =
        "Builder Code transaction submitted.<br><br>" +
        "<strong>Builder Code:</strong><br>" +
        BUILDER_CODE;

    }

  } catch (error) {

    console.error(error);

    message.textContent =
      "Transaction error: " +
      getErrorMessage(error);

  } finally {

    testBtn.disabled = false;

  }

}


/* =====================================================
   BUTTON EVENTS
===================================================== */

connectBtn.addEventListener(
  "click",
  connectWallet
);

switchBtn.addEventListener(
  "click",
  switchToBase
);

testBtn.addEventListener(
  "click",
  testBuilderCode
);


/* =====================================================
   START METAMASK
===================================================== */

initializeWallet();


/* =====================================================
   PONG GAME
===================================================== */

const canvas =
  document.getElementById("game");

const ctx =
  canvas.getContext("2d");

let ballX = 250;

let ballY = 150;

let ballDX = 3;

let ballDY = 3;

let paddleY = 125;


/* =====================================================
   GAME LOOP
===================================================== */

function gameLoop() {

  ctx.fillStyle =
    "black";

  ctx.fillRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  /*
    Paddle
  */

  ctx.fillStyle =
    "#2563eb";

  ctx.fillRect(
    10,
    paddleY,
    10,
    50
  );


  /*
    Ball
  */

  ctx.beginPath();

  ctx.arc(
    ballX,
    ballY,
    7,
    0,
    Math.PI * 2
  );

  ctx.fill();


  /*
    Move ball
  */

  ballX += ballDX;

  ballY += ballDY;


  /*
    Top / bottom
  */

  if (
    ballY <= 7 ||
    ballY >= canvas.height - 7
  ) {

    ballDY *= -1;

  }


  /*
    Paddle collision
  */

  if (
    ballX <= 20 &&
    ballY >= paddleY &&
    ballY <= paddleY + 50
  ) {

    ballDX *= -1;

  }


  /*
    Reset
  */

  if (
    ballX >= canvas.width - 7
  ) {

    ballX = 250;

    ballY = 150;

  }


  requestAnimationFrame(
    gameLoop
  );

}


/* =====================================================
   MOUSE CONTROL
===================================================== */

document.addEventListener(
  "mousemove",
  event => {

    const rect =
      canvas.getBoundingClientRect();

    paddleY =
      event.clientY -
      rect.top -
      25;

    paddleY =
      Math.max(
        0,
        Math.min(
          canvas.height - 50,
          paddleY
        )
      );

  }
);


/* =====================================================
   START GAME
===================================================== */

gameLoop();

</script>

</body>
</html>
