  <meta name="viewport" content="width=device-width, initial-scale=1.0">  <meta name="base:app_id" content="698d6ec5b3590846b38398f8">  <title>Rocky's Base Project</title>  <style>

      display: flex;
      flex-direction: column;

    h1 {
      margin: 0;

  </style></head><body><h1>Rocky's Base Project</h1><p>
  Desktop: W/S keys • Mobile: Drag finger up/down
</p><!-- WALLET --><div id="walletSection">  <button id="connectButton">
    Connect MetaMask
  </button>  <button id="openMetaMask">
    Open in MetaMask
  </button>  <button id="testTransaction">
    Test Builder Code
  </button>  <div id="walletAddress"></div>  <div id="status">
    Builder Code: bc_q8bj3kjd
  </div><a
id="txLink"
target="_blank"
rel="noopener noreferrer">
</a>

</div><canvas
id="gameCanvas"
width="800"
height="400">
</canvas>

<script>

  /*
   * ============================================================
   * ROCKY'S BUILDER CODE
   * ============================================================
   */

  const BUILDER_CODE = "bc_q8bj3kjd";

  /*
   * ERC-8021 suffix:
   *
   * [Builder Code ASCII]
   * [1 byte code length]
   * [1 byte schema ID]
   * [8021 repeated]
   *
   * This is schema 0, the canonical registry.
   */

  function createBuilderSuffix(code) {

    const encoder =
      new TextEncoder();

    const bytes =
      encoder.encode(code);

    if (bytes.length > 255) {
      throw new Error(
        "Builder Code is too long."
      );
    }

    let codeHex = "";

    for (const byte of bytes) {

      codeHex +=
        byte.toString(16).padStart(2, "0");

    }

    const codeLength =
      bytes.length
        .toString(16)
        .padStart(2, "0");

    const schemaId = "00";

    const erc8021 =
      "80218021802180218021802180218021";

    return (
      "0x" +
      codeHex +
      codeLength +
      schemaId +
      erc8021
    );
  }


  const DATA_SUFFIX =
    createBuilderSuffix(
      BUILDER_CODE
    );


  /*
   * Display useful debugging information.
   */

  console.log(
    "Rocky's Builder Code:",
    BUILDER_CODE
  );

  console.log(
    "ERC-8021 Data Suffix:",
    DATA_SUFFIX
  );


  /*
   * ============================================================
   * ELEMENTS
   * ============================================================
   */

  const connectButton =
    document.getElementById(
      "connectButton"
    );

  const openMetaMaskButton =
    document.getElementById(
      "openMetaMask"
    );

  const testButton =
    document.getElementById(
      "testTransaction"
    );

  const walletAddress =
    document.getElementById(
      "walletAddress"
    );

  const status =
    document.getElementById(
      "status"
    );

  const txLink =
    document.getElementById(
      "txLink"
    );


  let account = null;


  /*
   * ============================================================
   * METAMASK DETECTION
   * ============================================================
   */

  function getEthereum() {

    if (
      typeof window.ethereum !==
      "undefined"
    ) {

      return window.ethereum;

    }

    return null;

  }


  /*
   * ============================================================
   * OPEN SITE INSIDE METAMASK
   * ============================================================
   */

  function openInMetaMask() {

    const url =
      window.location.href;

    const cleanUrl =
      url.replace(
        /^https?:\/\//,
        ""
      );

    window.location.href =
      "https://metamask.app.link/dapp/" +
      cleanUrl;

  }


  /*
   * ============================================================
   * CONNECT
   * ============================================================
   */

  async function connectWallet() {

    const ethereum =
      getEthereum();


    /*
     * MetaMask isn't injected.
     */

    if (!ethereum) {

      status.textContent =
        "MetaMask was not detected. Tap Open in MetaMask.";

      openMetaMaskButton.style.display =
        "inline-block";

      return;

    }


    try {

      status.textContent =
        "Opening MetaMask...";


      /*
       * Request wallet connection.
       */

      const accounts =
        await ethereum.request({

          method:
            "eth_requestAccounts"

        });


      if (
        !accounts ||
        accounts.length === 0
      ) {

        throw new Error(
          "MetaMask returned no account."
        );

      }


      account =
        accounts[0];


      /*
       * Switch to Base.
       *
       * Base mainnet:
       * Chain ID = 8453
       * Hex = 0x2105
       */

      try {

        await ethereum.request({

          method:
            "wallet_switchEthereumChain",

          params: [
            {
              chainId: "0x2105"
            }
          ]

        });

      } catch (switchError) {

        /*
         * If Base isn't already added,
         * request MetaMask to add it.
         */

        if (
          switchError.code === 4902
        ) {

          await ethereum.request({

            method:
              "wallet_addEthereumChain",

            params: [
              {
                chainId:
                  "0x2105",

                chainName:
                  "Base",

                nativeCurrency: {
                  name: "Ether",
                  symbol: "ETH",
                  decimals: 18
                },

                rpcUrls: [
                  "https://mainnet.base.org"
                ],

                blockExplorerUrls: [
                  "https://basescan.org"
                ]

              }
            ]

          });

        } else {

          throw switchError;

        }

      }


      /*
       * Display wallet.
       */

      walletAddress.textContent =
        "Connected: " +
        account.slice(0, 6) +
        "..." +
        account.slice(-4);


      status.textContent =
        "Connected to Base • Builder Code: " +
        BUILDER_CODE;


      connectButton.textContent =
        "Connected";


      testButton.style.display =
        "inline-block";


      openMetaMaskButton.style.display =
        "none";


    } catch (error) {

      console.error(
        "MetaMask error:",
        error
      );


      status.textContent =
        "MetaMask error: " +
        (
          error.message ||
          "Connection failed."
        );

    }

  }


  /*
   * ============================================================
   * CONNECT BUTTON
   * ============================================================
   */

  connectButton.addEventListener(
    "click",
    connectWallet
  );


  /*
   * ============================================================
   * OPEN METAMASK BUTTON
   * ============================================================
   */

  openMetaMaskButton.addEventListener(
    "click",
    openInMetaMask
  );


  /*
   * ============================================================
   * BUILDER CODE TEST TRANSACTION
   * ============================================================
   *
   * This sends 0 ETH to the connected wallet.
   *
   * It is a REAL Base transaction and requires gas.
   *
   * The Builder Code is placed in the transaction data.
   *
   * ============================================================
   */

  testButton.addEventListener(
    "click",
    async () => {

      const ethereum =
        getEthereum();


      if (!ethereum) {

        status.textContent =
          "MetaMask is not available.";

        return;

      }


      if (!account) {

        status.textContent =
          "Connect MetaMask first.";

        return;

      }


      try {

        testButton.disabled =
          true;


        status.textContent =
          "Confirm the transaction in MetaMask...";


        txLink.textContent =
          "";


        /*
         * Send 0 ETH to ourselves.
         *
         * The data field contains the ERC-8021
         * Builder Code attribution suffix.
         */

        const transactionHash =
          await ethereum.request({

            method:
              "eth_sendTransaction",

            params: [
              {
                from:
                  account,

                to:
                  account,

                value:
                  "0x0",

                data:
                  DATA_SUFFIX

              }
            ]

          });


        status.textContent =
          "Transaction submitted!";


        txLink.textContent =
          "View on BaseScan";


        txLink.href =
          "https://basescan.org/tx/" +
          transactionHash;


        console.log(
          "Transaction:",
          transactionHash
        );


        console.log(
          "Builder Code:",
          BUILDER_CODE
        );


        console.log(
          "Data:",
          DATA_SUFFIX
        );


      } catch (error) {

        console.error(
          "Transaction error:",
          error
        );


        status.textContent =
          "Transaction error: " +
          (
            error.message ||
            "Transaction failed."
          );

      } finally {

        testButton.disabled =
          false;

      }

    }
  );


  /*
   * ============================================================
   * ACCOUNT CHANGE
   * ============================================================
   */

  const ethereum =
    getEthereum();


  if (ethereum) {

    ethereum.on(
      "accountsChanged",
      function(accounts) {

        if (
          !accounts ||
          accounts.length === 0
        ) {

          account = null;

          walletAddress.textContent =
            "";

          status.textContent =
            "Wallet disconnected.";

          testButton.style.display =
            "none";

          connectButton.textContent =
            "Connect MetaMask";

        } else {

          account =
            accounts[0];

          walletAddress.textContent =
            "Connected: " +
            account.slice(0, 6) +
            "..." +
            account.slice(-4);

        }

      }
    );

  }


  /*
   * ============================================================
   * INITIAL DETECTION
   * ============================================================
   */

  if (!ethereum) {

    openMetaMaskButton.style.display =
      "inline-block";

    status.textContent =
      "MetaMask not detected. Tap Open in MetaMask.";

  }

</script><!-- ============================================================
     PONG GAME
     ============================================================ --><script>

  const canvas =
    document.getElementById(
      "gameCanvas"
    );

  const ctx =
    canvas.getContext("2d");


  const paddleWidth = 10;
  const paddleHeight = 80;


  let playerY =
    canvas.height / 2 -
    paddleHeight / 2;


  let aiY =
    canvas.height / 2 -
    paddleHeight / 2;


  let ballX =
    canvas.width / 2;


  let ballY =
    canvas.height / 2;


  let ballSpeedX = 5;
  let ballSpeedY = 4;


  const keys = {};


  document.addEventListener(
    "keydown",
    (e) => {

      keys[
        e.key.toLowerCase()
      ] = true;

    }
  );


  document.addEventListener(
    "keyup",
    (e) => {

      keys[
        e.key.toLowerCase()
      ] = false;

    }
  );


  canvas.addEventListener(
    "touchmove",
    (e) => {

      e.preventDefault();

      const rect =
        canvas.getBoundingClientRect();

      const touchY =
        e.touches[0].clientY -
        rect.top;

      playerY =
        touchY -
        paddleHeight / 2;


      if (playerY < 0) {

        playerY = 0;

      }


      if (
        playerY >
        canvas.height -
        paddleHeight
      ) {

        playerY =
          canvas.height -
          paddleHeight;

      }

    },
    {
      passive: false
    }
  );


  function drawRect(
    x,
    y,
    w,
    h,
    color
  ) {

    ctx.fillStyle =
      color;

    ctx.fillRect(
      x,
      y,
      w,
      h
    );

  }


  function drawBall(
    x,
    y,
    r,
    color
  ) {

    ctx.fillStyle =
      color;

    ctx.beginPath();

    ctx.arc(
      x,
      y,
      r,
      0,
      Math.PI * 2
    );

    ctx.fill();

  }


  function update() {

    if (
      keys["w"] &&
      playerY > 0
    ) {

      playerY -= 6;

    }


    if (
      keys["s"] &&
      playerY <
      canvas.height -
      paddleHeight
    ) {

      playerY += 6;

    }


    const aiCenter =
      aiY +
      paddleHeight / 2;


    if (
      aiCenter <
      ballY - 20
    ) {

      aiY += 4;

    } else if (
      aiCenter >
      ballY + 20
    ) {

      aiY -= 4;

    }


    ballX +=
      ballSpeedX;

    ballY +=
      ballSpeedY;


    /*
     * Correct bounce behavior.
     */

    if (
      ballY <= 0 ||
      ballY >= canvas.height
    ) {

      ballSpeedY *= -1;

    }


    /*
     * Player paddle.
     */

    if (
      ballX <= 20 &&
      ballY > playerY &&
      ballY <
      playerY +
      paddleHeight
    ) {

      ballSpeedX *= -1;

    }


    /*
     * AI paddle.
     */

    if (
      ballX >=
      canvas.width - 20 &&
      ballY > aiY &&
      ballY <
      aiY +
      paddleHeight
    ) {

      ballSpeedX *= -1;

    }


    /*
     * Reset.
     */

    if (
      ballX < 0 ||
      ballX > canvas.width
    ) {

      ballX =
        canvas.width / 2;

      ballY =
        canvas.height / 2;

      ballSpeedX *= -1;

    }

  }


  function draw() {

    drawRect(
      0,
      0,
      canvas.width,
      canvas.height,
      "black"
    );


    for (
      let i = 0;
      i < canvas.height;
      i += 20
    ) {

      drawRect(
        canvas.width / 2 - 1,
        i,
        2,
        10,
        "#333"
      );

    }


    drawRect(
      10,
      playerY,
      paddleWidth,
      paddleHeight,
      "#0052FF"
    );


    drawRect(
      canvas.width - 20,
      aiY,
      paddleWidth,
      paddleHeight,
      "#0052FF"
    );


    drawBall(
      ballX,
      ballY,
      8,
      "red"
    );

  }


  function gameLoop() {

    update();

    draw();

    requestAnimationFrame(
      gameLoop
    );

  }


  gameLoop();

</script></body>
</html>
