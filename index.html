  <title>Rocky's Base Project</title>  <style>

  </style></head><body>
  <h1>Rocky's Base Project</h1>  <p>Desktop: W/S keys • Mobile: Drag finger up/down</p>  <!-- Base / Builder Code section -->  <div id="walletSection"><button id="connectButton">
  Connect Wallet
</button>

<button id="testButton" style="display:none;">
  Send 0 ETH Test Transaction
</button>

<div id="0x3d8250ac679dcfd1e90c29e7a64ab5013645e579"></div>
<div id="status"></div>
<a id="txLink" target="_blank"></a>

  </div><canvas id="gameCanvas" width="800" height="400"></canvas>

  <!-- Viem + OX directly from CDN -->  <script type="module">

    import {
      createWalletClient,
      custom,
      parseEther
    } from "https://esm.sh/viem@2.45.0";

    import { base } from "https://esm.sh/viem@2.45.0/chains";

    import {
      Attribution
    } from "https://esm.sh/ox@0.9.7/erc8021";

    /*
     * ============================================================
     * ROCKY'S BASE BUILDER CODE
     * ============================================================
     */

    const BUILDER_CODE = "bc_q8bj3kjd";

    /*
     * Base's recommended ERC-8021 data suffix.
     * This is automatically attached to transactions
     * sent through this wallet client.
     */

    const DATA_SUFFIX = Attribution.toDataSuffix({
      codes: [BUILDER_CODE]
    });

    let walletClient = null;
    let connectedAddress = null;

    const connectButton = document.getElementById("connectButton");
    const testButton = document.getElementById("testButton");
    const walletAddress = document.getElementById("walletAddress");
    const status = document.getElementById("status");
    const txLink = document.getElementById("txLink");

    /*
     * CONNECT WALLET
     */

    connectButton.addEventListener("click", async () => {

      if (!window.ethereum) {
        status.textContent =
          "No Ethereum wallet detected. Open this website in MetaMask or another compatible wallet.";
        return;
      }

      try {

        status.textContent = "Connecting wallet...";

        walletClient = createWalletClient({
          chain: base,
          transport: custom(window.ethereum),
          dataSuffix: DATA_SUFFIX
        });

        const addresses = await walletClient.requestAddresses();

        connectedAddress = addresses[0];

        /*
         * Make sure the wallet is on Base.
         */

        await walletClient.switchChain({
          id: base.id
        });

        walletAddress.textContent =
          "Connected: " +
          connectedAddress;

        status.textContent =
          "Connected to Base • Builder Code: " +
          BUILDER_CODE;

        connectButton.textContent = "Wallet Connected";

        testButton.style.display = "inline-block";

      } catch (error) {

        console.error(error);

        status.textContent =
          "Connection cancelled or failed: " +
          (error.shortMessage || error.message);

      }

    });

    /*
     * TEST TRANSACTION
     *
     * Sends 0 ETH to the connected wallet itself.
     *
     * This creates a real Base transaction and attaches
     * Rocky's Builder Code through DATA_SUFFIX.
     *
     * The transaction still requires Base gas.
     */

    testButton.addEventListener("click", async () => {

      if (!walletClient || !connectedAddress) {
        status.textContent = "Connect your wallet first.";
        return;
      }

      try {

        testButton.disabled = true;

        status.textContent =
          "Confirm the transaction in your wallet...";

        txLink.textContent = "";
        txLink.removeAttribute("href");

        const hash = await walletClient.sendTransaction({

          account: connectedAddress,

          to: connectedAddress,

          value: 0n

        });

        status.textContent =
          "Transaction submitted successfully!";

        txLink.textContent =
          "View transaction on BaseScan";

        txLink.href =
          "https://basescan.org/tx/" + hash;

        console.log("Transaction:", hash);
        console.log("Builder Code:", BUILDER_CODE);
        console.log("Data Suffix:", DATA_SUFFIX);

      } catch (error) {

        console.error(error);

        status.textContent =
          "Transaction failed or cancelled: " +
          (error.shortMessage || error.message);

      } finally {

        testButton.disabled = false;

      }

    });

  </script>  <!-- ==========================================================
       PONG GAME
       ========================================================== -->  <script>

    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const paddleWidth = 10;
    const paddleHeight = 80;

    let playerY = canvas.height / 2 - paddleHeight / 2;
    let aiY = canvas.height / 2 - paddleHeight / 2;

    let ballX = canvas.width / 2;
    let ballY = canvas.height / 2;

    let ballSpeedX = 5;
    let ballSpeedY = 4;

    const keys = {};

    // Keyboard controls

    document.addEventListener("keydown", (e) => {
      keys[e.key.toLowerCase()] = true;
    });

    document.addEventListener("keyup", (e) => {
      keys[e.key.toLowerCase()] = false;
    });

    // Mobile touch controls

    canvas.addEventListener("touchmove", (e) => {

      e.preventDefault();

      const rect = canvas.getBoundingClientRect();

      const touchY =
        e.touches[0].clientY - rect.top;

      playerY =
        touchY - paddleHeight / 2;

      if (playerY < 0)
        playerY = 0;

      if (playerY > canvas.height - paddleHeight)
        playerY = canvas.height - paddleHeight;

    }, { passive: false });


    function drawRect(x, y, w, h, color) {

      ctx.fillStyle = color;

      ctx.fillRect(x, y, w, h);

    }


    function drawBall(x, y, r, color) {

      ctx.fillStyle = color;

      ctx.beginPath();

      ctx.arc(
        x,
        y,
        r,
        0,
        Math.PI * 2
      );

      ctx.fill();

    }


    function update() {

      // Desktop movement

      if (keys["w"] && playerY > 0) {
        playerY -= 6;
      }

      if (
        keys["s"] &&
        playerY < canvas.height - paddleHeight
      ) {
        playerY += 6;
      }


      // AI movement

      const aiCenter =
        aiY + paddleHeight / 2;

      if (aiCenter < ballY - 20) {

        aiY += 4;

      } else if (aiCenter > ballY + 20) {

        aiY -= 4;

      }


      // Ball movement

      ballX += ballSpeedX;
      ballY += ballSpeedY;


      // Top/bottom bounce

      if (
        ballY <= 0 ||
        ballY >= canvas.height
      ) {

        ballSpeedY *= 1;

      }


      // Player paddle collision

      if (
        ballX <= 20 &&
        ballY > playerY &&
        ballY < playerY + paddleHeight
      ) {

        ballSpeedX *= 1;

      }


      // AI paddle collision

      if (
        ballX >= canvas.width - 20 &&
        ballY > aiY &&
        ballY < aiY + paddleHeight
      ) {

        ballSpeedX *= 1;

      }


      // Reset ball

      if (
        ballX < 0 ||
        ballX > canvas.width
      ) {

        ballX =
          canvas.width / 2;

        ballY =
          canvas.height / 2;

        ballSpeedX *= 1;

      }

    }


    function draw() {

      drawRect(
        0,
        0,
        canvas.width,
        canvas.height,
        "black"
      );


      // Middle line

      for (
        let i = 0;
        i < canvas.height;
        i += 20
      ) {

        drawRect(
          canvas.width / 2 - 1,
          i,
          2,
          10,
          "#333"
        );

      }


      // Player paddle

      drawRect(
        10,
        playerY,
        paddleWidth,
        paddleHeight,
        "#0052FF"
      );


      // AI paddle

      drawRect(
        canvas.width - 20,
        aiY,
        paddleWidth,
        paddleHeight,
        "#0052FF"
      );


      // Ball

      drawBall(
        ballX,
        ballY,
        8,
        "red"
      );

    }


    function gameLoop() {

      update();

      draw();

      requestAnimationFrame(gameLoop);

    }

    gameLoop();

  </script></body>
